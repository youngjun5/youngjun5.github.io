<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="description" content="CARECENTER 토라포션 — 주차별 토라 포션 묵상, 히브리 절기, 오메르 카운트 모음">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="토라포션">
<title>토라포션 · STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --grid-line: rgba(230,231,233,0.05);
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --amber: #e0ab4c;
    --green: #6fbf85;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 22px clamp(16px, 5vw, 56px) 0;
  }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--surface); border: 1px solid var(--hair-strong);
    padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
  .wordmark {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.01em; display: flex; align-items: center; gap: 6px;
  }
  .wordmark .sep { color: var(--ink-faint); font-weight: 500; }
  .wordmark .dot { color: var(--accent); }
  header .owner {
    margin-left: auto; font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  main { padding: clamp(20px, 5vw, 40px) clamp(16px, 5vw, 56px) 72px; max-width: 1000px; margin: 0 auto; }

  .intro { max-width: 640px; margin-bottom: 22px; }
  .intro .eyebrow {
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .intro h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(24px, 3.6vw, 32px); line-height: 1.18; margin: 0 0 10px;
  }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 58ch; }

  .controls {
    position: sticky; top: 0; z-index: 20; padding: 14px 0 12px; margin-bottom: 18px;
    background: linear-gradient(var(--ground) 82%, transparent);
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 11px;
    padding: 10px 14px; margin-bottom: 12px;
  }
  .search svg { flex: none; color: var(--ink-faint); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--ink);
    font: 500 14px "IBM Plex Sans", sans-serif;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search .count { font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-faint); flex: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font: 600 12.5px "IBM Plex Sans", sans-serif; letter-spacing: 0.01em;
    padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover { border-color: var(--hair-strong); color: var(--ink); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--ink-faint); font: 500 11px "IBM Plex Mono", monospace; }
  .chip.active .n { color: var(--accent); opacity: .75; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
    cursor: pointer; transition: border-color .12s ease, background .12s ease;
  }
  .row:hover { border-color: var(--hair-strong); background: var(--surface-2); }
  .row.no-match { display: none; }
  .row-icon { font-size: 20px; flex: none; width: 26px; text-align: center; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font: 600 14px "IBM Plex Sans", sans-serif; margin-bottom: 3px; }
  .row-meta { font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; }
  .tag { font: 600 10px "IBM Plex Sans", sans-serif; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); }
  .tag.toraportion { color: var(--accent); background: var(--accent-soft); }
  .tag.omer { color: var(--amber); background: rgba(224,171,76,0.12); }
  .tag.hebcal { color: var(--green); background: rgba(111,191,133,0.12); }
  .row-arrow { color: var(--ink-faint); flex: none; }
  .row:hover .row-arrow { color: var(--accent); }

  .empty { text-align: center; color: var(--ink-faint); padding: 40px 0; font-size: 13px; }

  footer {
    padding: 20px clamp(16px, 5vw, 56px) 40px; color: var(--ink-faint); font-size: 12px;
    max-width: 1000px; margin: 0 auto;
  }

  /* reader overlay */
  .reader {
    position: fixed; inset: 0; background: var(--ground); z-index: 100;
    overflow-y: auto;
  }
  .reader[hidden] { display: none; }
  .reader-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 14px clamp(16px, 5vw, 40px); background: rgba(18,19,22,0.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--hair);
  }
  .reader-back {
    display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px "IBM Plex Mono", monospace;
    color: var(--ink-soft); cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hair);
  }
  .reader-back:hover { color: var(--ink); border-color: var(--hair-strong); }
  .reader-tag { margin-left: auto; }
  .reader-art {
    max-width: 720px; margin: 0 auto; padding: 30px clamp(16px, 5vw, 40px) 100px;
  }
  .reader-art .icon { font-size: 34px; margin-bottom: 10px; }
  .reader-art h2 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: clamp(22px, 4vw, 30px);
    line-height: 1.25; margin: 0 0 6px;
  }
  .reader-art .date { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint); margin-bottom: 24px; }

  .reader-body { font: 400 15.5px/1.85 "IBM Plex Sans", sans-serif; color: var(--ink); }
  .reader-body h3 {
    font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 20px; color: var(--ink);
    margin: 34px 0 12px;
  }
  .reader-body h4 {
    font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 16.5px; color: var(--ink);
    margin: 24px 0 8px;
  }
  .reader-body p { margin: 0 0 14px; }
  .reader-body strong { color: var(--ink); font-weight: 700; }
  .reader-body hr { border: none; border-top: 1px solid var(--hair); margin: 28px 0; }
  .reader-body ul, .reader-body ol { margin: 0 0 14px; padding-left: 22px; }
  .reader-body li { margin-bottom: 6px; }
  .reader-body .callout {
    background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 12px;
    padding: 16px 18px; margin: 18px 0; font-size: 14.5px;
  }
  .reader-body .callout h3, .reader-body .callout h4 { margin-top: 0; }
  .reader-body .note {
    color: var(--ink-faint); font-size: 13px; font-style: italic; border-left: 2px solid var(--hair-strong);
    padding-left: 12px;
  }
  .reader-body table {
    width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 13.5px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; overflow: hidden;
  }
  .reader-body table :is(td, th) {
    padding: 9px 12px; border: 1px solid var(--hair); text-align: left; vertical-align: top;
  }
  .reader-body table th { background: var(--surface-2); font-weight: 700; }
  .reader-body blockquote {
    margin: 0 0 14px; padding: 4px 0 4px 16px; border-left: 2px solid var(--accent);
    color: var(--ink-soft); font-style: italic;
  }
  .reader-wide-table { overflow-x: auto; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="mark" href="../"><img src="../mark-256.png" alt=""></a>
  <span class="wordmark">STUDIO<span class="sep">/</span>토라포션<span class="dot">.</span></span>
  <span class="owner">케어코너즈</span>
</header>

<main>
  <div class="intro">
    <p class="eyebrow">CARECENTER 토라포션</p>
    <h1>토라 포션 아카이브</h1>
    <p>노션에서 옮겨온 주차별 토라 포션 묵상, 히브리 절기, 오메르 카운트 자료예요. 항목을 누르면 전체 내용을 읽을 수 있습니다.</p>
  </div>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6.5"/><path d="M18 18l-4.5-4.5"/></svg>
      <input id="q" type="text" placeholder="포션 이름 검색 (예: 르에, 니산, 유월절)">
      <span class="count" id="resultCount"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="list" id="list"></div>
  <p class="empty" id="emptyMsg" hidden>검색 결과가 없어요.</p>
</main>

<footer>노션 "Torah Portion 토라 포션" 데이터베이스에서 옮겨왔어요 · 주차별 요약 위주 · 오메르 주차 항목은 일일 묵상 전문은 아직 생략되어 있어요.</footer>

<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <span class="reader-back" id="readerBack">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>
      목록으로
    </span>
    <span class="reader-tag tag" id="readerTag"></span>
  </div>
  <div class="reader-art">
    <div class="icon" id="readerIcon"></div>
    <h2 id="readerTitle"></h2>
    <div class="date" id="readerDate"></div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<script>
  var CAT_LABEL = {
    "토라 포션 묵상": "토라 포션",
    "OMER(오메르) COUNT": "오메르 카운트",
    "히브리 절기 & 기념일": "히브리 절기",
    "Teaching Notes": "티칭 노트"
  };
  var CAT_CLASS = {
    "토라 포션 묵상": "toraportion",
    "OMER(오메르) COUNT": "omer",
    "히브리 절기 & 기념일": "hebcal",
    "Teaching Notes": ""
  };
  var CAT_ORDER = ["토라 포션 묵상", "히브리 절기 & 기념일", "OMER(오메르) COUNT", "Teaching Notes"];

  var data = [];
  var rows = [];

  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(iso){
    if (!iso) return "";
    var p = iso.split("-");
    return p[0] + "." + p[1] + "." + p[2];
  }

  function rowHTML(item, idx){
    return (
      '<div class="row" data-idx="' + idx + '" data-name="' + esc((item.title||"").toLowerCase()) + '">' +
        '<div class="row-icon">' + (item.icon || "📜") + '</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + esc(item.title) + '</div>' +
          '<div class="row-meta">' +
            (item.date_start ? '<span>' + fmtDate(item.date_start) + '</span>' : '') +
            '<span class="tag ' + (CAT_CLASS[item.cat]||"") + '">' + esc(CAT_LABEL[item.cat] || item.cat) + '</span>' +
          '</div>' +
        '</div>' +
        '<svg class="row-arrow" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>' +
      '</div>'
    );
  }

  function render(){
    var byCat = {};
    data.forEach(function(item, idx){ item._idx = idx; (byCat[item.cat] = byCat[item.cat] || []).push(item); });

    var chipsWrap = document.getElementById("chips");
    var chipsHTML = '<button class="chip active" data-cat="all">전체 <span class="n">' + data.length + '</span></button>';
    CAT_ORDER.forEach(function(cat){
      if (!byCat[cat]) return;
      chipsHTML += '<button class="chip" data-cat="' + esc(cat) + '">' + (CAT_LABEL[cat]||cat) + ' <span class="n">' + byCat[cat].length + '</span></button>';
    });
    chipsWrap.innerHTML = chipsHTML;

    var listWrap = document.getElementById("list");
    listWrap.innerHTML = data.map(function(it){ return rowHTML(it, it._idx); }).join("");

    rows = Array.prototype.slice.call(document.querySelectorAll(".row"));
    rows.forEach(function(el){
      el.addEventListener("click", function(){ openReader(parseInt(el.getAttribute("data-idx"), 10)); });
    });

    chipsWrap.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        chipsWrap.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
        chip.classList.add("active");
        var cat = chip.getAttribute("data-cat");
        rows.forEach(function(el){
          var idx = parseInt(el.getAttribute("data-idx"), 10);
          var match = cat === "all" || data[idx].cat === cat;
          el.dataset.catHidden = match ? "" : "1";
        });
        applySearch();
      });
    });
  }

  function applySearch(){
    var q = document.getElementById("q").value.trim().toLowerCase();
    var visibleCount = 0;
    rows.forEach(function(el){
      var catHidden = el.dataset.catHidden === "1";
      var match = !q || el.getAttribute("data-name").indexOf(q) !== -1;
      var show = match && !catHidden;
      el.classList.toggle("no-match", !show);
      if (show) visibleCount++;
    });
    document.getElementById("resultCount").textContent = q ? (visibleCount + "개") : "";
    document.getElementById("emptyMsg").hidden = visibleCount !== 0;
  }
  document.getElementById("q").addEventListener("input", applySearch);

  // reader
  var reader = document.getElementById("reader");
  function openReader(idx){
    var item = data[idx];
    document.getElementById("readerIcon").textContent = item.icon || "📜";
    document.getElementById("readerTitle").textContent = item.title;
    document.getElementById("readerDate").textContent = fmtDate(item.date_start);
    var tagEl = document.getElementById("readerTag");
    tagEl.textContent = CAT_LABEL[item.cat] || item.cat;
    tagEl.className = "reader-tag tag " + (CAT_CLASS[item.cat]||"");
    document.getElementById("readerBody").innerHTML = item.html || "<p>내용이 없습니다.</p>";
    reader.hidden = false;
    reader.scrollTop = 0;
    document.body.style.overflow = "hidden";
    history.pushState({torahReader: true}, "", "#" + encodeURIComponent(item.id));
  }
  function closeReader(){
    reader.hidden = true;
    document.body.style.overflow = "";
    if (location.hash) history.pushState({}, "", location.pathname);
  }
  document.getElementById("readerBack").addEventListener("click", closeReader);
  window.addEventListener("popstate", function(){
    if (!location.hash) reader.hidden = true, document.body.style.overflow = "";
  });

  function openFromHash(){
    if (!location.hash) return;
    var id = decodeURIComponent(location.hash.slice(1));
    var idx = data.findIndex(function(d){ return d.id === id; });
    if (idx !== -1) openReader(idx);
  }

  fetch("./torah_data.json").then(function(r){ return r.json(); }).then(function(json){
    data = json;
    render();
    applySearch();
    openFromHash();
  });
</script>
</body>
</html>
