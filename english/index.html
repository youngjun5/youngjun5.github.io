<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#F6F6F4; --ink:#1F2328; --ink-soft:#5F666D; --ink-faint:#949AA0;
  --line:#E4E2DC; --accent:#2F5FD0; --accent-soft:#E6EDFB;
  --t-mean:#1F6FC4; --t-ex:#1E8A3E; --t-nu:#D23A2E; --t-also:#9440BF; --ex:#1F5FB8;
  --again:#D23A2E; --hard:#B7791F; --good:#1E8A3E; --easy:#1F6FC4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -14px rgba(0,0,0,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1B1E22; --surface-2:#22262B; --ink:#E9E7E1; --ink-soft:#A3A9B0; --ink-faint:#6E747B;
    --line:#2E3338; --accent:#7EA2F2; --accent-soft:#1F2A40;
    --t-mean:#4D93E0; --t-ex:#3BAA5C; --t-nu:#E2604F; --t-also:#B26BDB; --ex:#8DB4F5;
    --again:#E2604F; --hard:#D9A14A; --good:#3BAA5C; --easy:#4D93E0;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 140px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .spacer{flex:1}
.back{color:var(--ink-soft);font-size:13px;text-decoration:none}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;margin:0 auto 18px;box-shadow:var(--shadow)}
.tab{padding:6px 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-soft)}
.tab.on{background:var(--accent-soft);color:var(--accent)}

/* 홈 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.hero .day{font:600 13px "IBM Plex Mono",monospace;color:var(--accent)}
.hero h1{font-size:26px;margin:4px 0 2px;line-height:1.3}
.hero .sub{color:var(--ink-soft);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:14px}
.go{display:block;width:100%;margin-top:18px;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.go[disabled]{opacity:.45;cursor:default}
.how{margin-top:16px;font-size:13px;color:var(--ink-soft);line-height:1.7}
.how b{color:var(--ink)}
.more{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.more a,.more button{font-size:13px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface)}

/* 카드 */
.card-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin-bottom:6px}
.counts span{margin-left:10px;font-weight:600}
.c-new{color:var(--t-mean)} .c-learn{color:var(--again)} .c-rev{color:var(--good)}
.word{text-align:center;padding:26px 0 18px}
.word .w{font-size:34px;font-weight:700;letter-spacing:-.01em}
.word .pos{font-size:13px;color:var(--ink-faint);margin-left:6px;font-weight:400}
.speak{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);vertical-align:middle;margin-left:8px}
.front-hint{text-align:center;color:var(--ink-faint);font-size:13px;margin-top:6px}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.tag{display:inline-block;color:#fff;font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 8px;margin-bottom:8px}
.t-mean{background:var(--t-mean)} .t-ex{background:var(--t-ex)} .t-nu{background:var(--t-nu)} .t-also{background:var(--t-also)}
.mean{font-size:24px;font-weight:700;line-height:1.35}
.ex{font-size:18px;font-style:italic;color:var(--ex);line-height:1.45}
.ex b{font-weight:700}
.exko{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.nu{font-size:14.5px;line-height:1.85;color:var(--ink-soft)}
.also+.also{margin-top:10px}
.also .aw{font-weight:700}
.also .ap{font-size:12px;color:var(--ink-faint);margin:0 4px}
.also .aex{font-size:14px;font-style:italic;color:var(--ex);margin-top:2px}
.also .aex b{font-weight:700}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:center}
.show{flex:1;max-width:420px;background:var(--accent);color:#fff;border-radius:10px;padding:13px;font-weight:700;font-size:15px}
.rate{flex:1;max-width:130px;border:1px solid var(--line);border-radius:10px;padding:6px 4px 8px;background:var(--surface);text-align:center}
.rate small{display:block;font:500 11px "IBM Plex Mono",monospace;color:var(--ink-faint)}
.rate b{font-size:14.5px}
.rate.again b{color:var(--again)} .rate.hard b{color:var(--hard)} .rate.good b{color:var(--good)} .rate.easy b{color:var(--easy)}
.kbd{display:none}
@media (hover:hover){.kbd{display:inline;font:500 10px "IBM Plex Mono",monospace;color:var(--ink-faint);margin-left:4px}}

.done{text-align:center;padding:50px 10px}
.done h2{font-size:22px;margin:0 0 6px}
.done p{color:var(--ink-soft);margin:0}

/* 단어 목록 */
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:inherit;margin-bottom:12px}
.dayh{font:600 12px "IBM Plex Mono",monospace;color:var(--ink-faint);margin:18px 2px 6px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .rw{font-weight:600;min-width:120px}
.row .rk{color:var(--ink-soft);font-size:13.5px;flex:1}
.dot{width:7px;height:7px;border-radius:50%;flex:none;align-self:center;background:var(--line)}
.dot.learn{background:var(--again)} .dot.review{background:var(--good)} .dot.mature{background:var(--easy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .x{display:block;margin:0 0 0 auto;font-size:14px;color:var(--ink-soft);padding:8px}
.empty{color:var(--ink-faint);text-align:center;padding:40px 0}
</style>

<body>
<div class="wrap">
  <header class="topbar" data-cc-replace>
    <a class="back" href="../">‹ 케어센터</a>
    <span class="spacer"></span>
  </header>
  <nav class="tabs"><button class="tab on" data-view="home">오늘</button><button class="tab" data-view="list">단어 목록</button></nav>
  <main id="view"></main>
</div>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
/* ═══ 설정 ═══
   영상(교포소리 영어 공부법) 기준: 가장 많이 쓰는 단어 3,000개 · 하루 30개 · 간격 반복 + 능동 회상(앞면은 단어만). */
var PER_DAY = 30;
var LS = 'vocab3000:v1';
var MIN = 60000, DAY = 86400000;
var LEARN_STEPS = [1, 10];        /* 처음 외우는 단계(분) — Anki 기본값 */
var RELEARN_STEP = 10;            /* 복습 중 '다시'를 누르면 10분 뒤 다시 */

var WORDS = [], BY = {}, P = null, view = 'home', session = null;

function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function now(){return Date.now();}
function endOfToday(){var d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

/* ═══ 진행 기록 (이 기기에 저장) ═══ */
function load(){
  try{P=JSON.parse(localStorage.getItem(LS));}catch(e){}
  if(!P||!P.cards) P={cards:{},introduced:0,newDay:'',newToday:0,days:[]};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(P));}catch(e){}}
function rollDay(){ if(P.newDay!==today()){P.newDay=today();P.newToday=0;} }

/* ═══ 간격 반복 (Anki SM-2 단순화) ═══
   card: {s:'learn'|'review', step, due(ms), ivl(일), ease, lapses} */
function schedule(c,r,t){ /* r: 0 다시 · 1 어려움 · 2 알맞음 · 3 쉬움. 새 객체를 돌려줌 */
  c=c?JSON.parse(JSON.stringify(c)):{s:'learn',step:0,ivl:0,ease:2.5,lapses:0,due:t};
  if(c.s==='learn'){
    var steps=c.relearn?[RELEARN_STEP]:LEARN_STEPS;
    if(r===0){c.step=0;c.due=t+steps[0]*MIN;}
    else if(r===1){c.due=t+(c.step+1<steps.length?(steps[c.step]+steps[c.step+1])/2:steps[c.step]*1.5)*MIN;}
    else if(r===2){
      if(c.step+1<steps.length){c.step++;c.due=t+steps[c.step]*MIN;}
      else{c.s='review';c.ivl=c.relearn?Math.max(1,c.ivl):1;c.due=t+c.ivl*DAY;delete c.relearn;}
    }else{c.s='review';c.ivl=c.relearn?Math.max(2,c.ivl):4;c.due=t+c.ivl*DAY;delete c.relearn;}
    return c;
  }
  if(r===0){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=Math.max(1,Math.round(c.ivl*0.5));c.s='learn';c.relearn=1;c.step=0;c.due=t+RELEARN_STEP*MIN;return c;}
  var n;
  if(r===1){n=c.ivl*1.2;c.ease=Math.max(1.3,c.ease-0.15);}
  else if(r===2){n=c.ivl*c.ease;}
  else{n=c.ivl*c.ease*1.3;c.ease+=0.15;}
  c.ivl=Math.min(3650,Math.max(c.ivl+1,Math.round(n)));
  c.due=t+c.ivl*DAY;
  return c;
}
function fmtGap(ms){
  var m=ms/MIN; if(m<60) return '<'+Math.max(1,Math.ceil(m))+'분';
  var d=ms/DAY; if(d<1) return Math.round(m/60)+'시간';
  if(d<30) return Math.round(d)+'일'; if(d<365) return (d/30).toFixed(d<60?1:0)+'달'; return (d/365).toFixed(1)+'년';
}

/* ═══ 오늘 할 카드 ═══ */
function counts(){
  rollDay();
  var t=now(), eod=endOfToday(), learn=0, rev=0;
  Object.keys(P.cards).forEach(function(w){var c=P.cards[w]; if(c.s==='learn') learn++; else if(c.due<=eod) rev++;});
  var newLeft=Math.max(0,Math.min(PER_DAY-P.newToday,WORDS.length-P.introduced));
  return {learn:learn,rev:rev,newLeft:newLeft};
}
/* 다음 카드: 시간 된 학습 카드 → 오늘 복습 → 새 단어 → (남은 게 학습 카드뿐이면) 가장 빠른 학습 카드 */
function nextCard(){
  rollDay();
  var t=now(), eod=endOfToday(), dueLearn=null, rev=null, ahead=null;
  Object.keys(P.cards).forEach(function(w){
    var c=P.cards[w];
    if(c.s==='learn'){ if(c.due<=t&&(!dueLearn||c.due<P.cards[dueLearn].due)) dueLearn=w; if(!ahead||c.due<P.cards[ahead].due) ahead=w; }
    else if(c.due<=eod&&(!rev||c.due<P.cards[rev].due)) rev=w;
  });
  if(dueLearn) return dueLearn;
  if(rev) return rev;
  if(P.newToday<PER_DAY&&P.introduced<WORDS.length) return WORDS[P.introduced].w;
  return ahead;
}
function rate(w,r){
  var t=now(), isNew=!P.cards[w];
  P.cards[w]=schedule(P.cards[w],r,t);
  if(isNew){P.introduced++;P.newToday++;}
  if(P.days.indexOf(today())<0){P.days.push(today());if(P.days.length>400)P.days.shift();}
  save();
}
function streak(){
  var n=0,d=new Date();
  if(P.days.indexOf(today())<0) d.setDate(d.getDate()-1);
  while(P.days.indexOf(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())>=0){n++;d.setDate(d.getDate()-1);}
  return n;
}

/* ═══ 그리기 ═══ */
function hl(text,w){ /* 예문 속 표제어(활용형 포함) 굵게 */
  /* 여러 단어 표현(on time, give up)은 표현 전체, 한 단어는 어간+활용 어미 */
  var re=w.trim().split(/\s+/).map(function(p){ var st=p.length>4?p.replace(/(e|y)$/,''):p; return st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*'; }).join('\\s+');
  return esc(text).replace(new RegExp('\\b('+re+')','gi'),'<b>$1</b>');
}
function backHTML(x){
  var h='<div class="box"><span class="tag t-mean">뜻</span><div class="mean">'+esc(x.ko)+'</div></div>'+
    '<div class="box"><span class="tag t-ex">문장</span><div class="ex">'+hl(x.ex,x.w)+'</div><div class="exko">'+esc(x.exKo)+'</div></div>';
  if(x.nu) h+='<div class="box"><span class="tag t-nu">뉘앙스</span><div class="nu">'+esc(x.nu)+'</div></div>';
  if(x.also&&x.also.length) h+='<div class="box"><span class="tag t-also">이렇게도 쓰인다</span>'+x.also.map(function(a){
    return '<div class="also"><span class="aw">'+esc(a.w)+'</span><span class="ap">'+esc(a.pos||'')+'</span>'+esc(a.ko)+(a.ex?'<div class="aex">'+hl(a.ex,a.w)+'</div>':'')+'</div>';
  }).join('')+'</div>';
  return h;
}
function wordHead(x){
  return '<div class="word"><span class="w">'+esc(x.w)+'</span><span class="pos">'+esc(x.pos)+'</span>'+
    '<button class="speak" data-say="'+esc(x.w)+'" title="발음 듣기" aria-label="발음 듣기">🔊</button></div>';
}
function setView(v){
  view=v; session=null;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.view===v);});
  render();
}
function render(){
  var dock=document.getElementById('dock'), V=document.getElementById('view');
  dock.hidden=true;
  if(!WORDS.length){V.innerHTML='<div class="empty">단어를 불러오는 중…</div>';return;}
  if(view==='list') return renderList(V);
  if(session) return renderCard(V);
  var c=counts(), learned=Object.keys(P.cards).length, mature=Object.keys(P.cards).filter(function(w){return P.cards[w].ivl>=21;}).length;
  var day=Math.min(Math.floor(Math.max(0,P.introduced-P.newToday)/PER_DAY)+1,Math.ceil(WORDS.length/PER_DAY));
  var todo=c.learn+c.rev+c.newLeft;
  V.innerHTML='<div class="hero"><div class="day">DAY '+day+' / '+Math.ceil(WORDS.length/PER_DAY)+'</div>'+
    '<h1>'+(todo?'오늘 '+todo+'장 남았어요':'오늘 공부 끝!')+'</h1>'+
    '<div class="sub">'+(todo?'새 단어 '+c.newLeft+' · 복습 '+c.rev+' · 다시 볼 카드 '+c.learn:'내일 새 단어 '+PER_DAY+'개와 복습이 기다려요.')+'</div>'+
    '<div class="stats"><div class="stat"><b>'+learned+'</b><span>만난 단어</span></div><div class="stat"><b>'+mature+'</b><span>장기 기억</span></div><div class="stat"><b>'+streak()+'</b><span>연속 공부일</span></div></div>'+
    '<div class="prog-l"><span>3,000 단어 중</span><span>'+Math.round(learned/WORDS.length*1000)/10+'%</span></div><div class="bar"><i style="width:'+(learned/WORDS.length*100)+'%"></i></div>'+
    '<button class="go" id="start"'+(todo?'':' disabled')+'>'+(todo?'공부 시작':'오늘은 여기까지')+'</button></div>'+
    '<div class="how"><b>이렇게 외워요.</b> 앞면엔 단어만 나와요. 뜻을 먼저 <b>스스로 떠올려 본 다음</b> 뒤집으세요(능동 회상). 얼마나 잘 떠올렸는지 '+
    '<b>다시 · 어려움 · 알맞음 · 쉬움</b> 중에 고르면, 잊어버릴 때쯤 다시 보여줘요(간격 반복). 뜻만 보지 말고 <b>예문을 통째로 소리 내 읽으세요.</b> '+
    '하루 30개씩 100일이면 3,000개, 미드 대사의 95%를 알아듣는 양이에요.</div>'+
    '<div class="more"><a href="sentence.html">하루 한 문장 →</a></div>';
}
function renderCard(V){
  var w=session.cur, x=BY[w];
  if(!w){ session=null; V.innerHTML='<div class="done"><h2>오늘 공부 끝!</h2><p>'+session_done_msg()+'</p></div>'; setTimeout(function(){ if(!session&&view==='home') render(); },2200); return; }
  var c=counts();
  var top='<div class="card-top"><span>'+(P.cards[w]?(P.cards[w].s==='learn'?'다시 보는 카드':'복습'):'새 단어')+'</span><span class="counts"><span class="c-new">'+c.newLeft+'</span><span class="c-learn">'+c.learn+'</span><span class="c-rev">'+c.rev+'</span></span></div>';
  V.innerHTML=top+wordHead(x)+(session.flip?backHTML(x):'<div class="front-hint">뜻을 떠올려 보고 뒤집으세요</div>');
  var dock=document.getElementById('dock'), D=document.getElementById('dockIn'); dock.hidden=false;
  if(!session.flip){ D.innerHTML='<button class="show" id="flip">정답 보기<span class="kbd">Space</span></button>'; return; }
  var t=now(), labels=['다시','어려움','알맞음','쉬움'], cls=['again','hard','good','easy'];
  D.innerHTML=labels.map(function(l,i){ return '<button class="rate '+cls[i]+'" data-rate="'+i+'"><small>'+fmtGap(schedule(P.cards[w],i,t).due-t)+'</small><b>'+l+'</b><span class="kbd">'+(i+1)+'</span></button>'; }).join('');
}
function session_done_msg(){ return '새 단어 '+P.newToday+'개를 만났어요. 내일 다시 와서 복습하면 오래 기억돼요.'; }
function startSession(){ session={cur:nextCard(),flip:false}; render(); window.scrollTo(0,0); }

function renderList(V){
  var q=(document.getElementById('q')||{}).value||'';
  var html='<input class="search" id="q" type="search" placeholder="영어 단어나 뜻으로 찾기" value="'+esc(q)+'" autocomplete="off">';
  var ql=q.trim().toLowerCase(), days=Math.ceil(WORDS.length/PER_DAY), any=false;
  for(var d=0;d<days;d++){
    var items=WORDS.slice(d*PER_DAY,(d+1)*PER_DAY).filter(function(x){return !ql||x.w.toLowerCase().indexOf(ql)>=0||x.ko.indexOf(q.trim())>=0;});
    if(!items.length) continue;
    if(!ql&&d*PER_DAY>P.introduced+PER_DAY*2&&d>2){ html+='<div class="dayh"><span>DAY '+(d+1)+' – '+days+'</span><span>검색하면 미리 볼 수 있어요</span></div>'; any=true; break; }
    any=true;
    html+='<div class="dayh"><span>DAY '+(d+1)+'</span><span>'+(d*PER_DAY+1)+'–'+Math.min(WORDS.length,(d+1)*PER_DAY)+'</span></div><div class="list">'+items.map(function(x){
      var c=P.cards[x.w], st=!c?'':c.s==='learn'?'learn':c.ivl>=21?'mature':'review';
      return '<button class="row" data-open="'+esc(x.w)+'"><span class="dot '+st+'"></span><span class="rw">'+esc(x.w)+'</span><span class="rk">'+esc(x.ko)+'</span></button>';
    }).join('')+'</div>';
  }
  if(!any) html+='<div class="empty">찾는 단어가 없어요</div>';
  V.innerHTML=html;
  var qi=document.getElementById('q'); if(q){qi.focus();qi.setSelectionRange(q.length,q.length);}
}

/* ═══ 발음 (브라우저 음성) ═══ */
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9;
  var v=speechSynthesis.getVoices().filter(function(v){return v.lang==='en-US';});
  var pick=v.filter(function(x){return /samantha|alex|google us|aria|jenny/i.test(x.name);})[0]||v[0]; if(pick) u.voice=pick;
  speechSynthesis.speak(u);
}

/* ═══ 입력 ═══ */
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.view) return setView(b.dataset.view);
  if(b.dataset.say){ say(b.dataset.say); return; }
  if(b.id==='start') return startSession();
  if(b.id==='flip'){ session.flip=true; render(); return; }
  if(b.dataset.rate!=null){ rate(session.cur,+b.dataset.rate); session={cur:nextCard(),flip:false}; render(); window.scrollTo(0,0); return; }
  if(b.dataset.open){ var x=BY[b.dataset.open]; document.getElementById('sheet').innerHTML='<button class="x" id="closeM">닫기</button>'+wordHead(x)+backHTML(x); document.getElementById('modal').hidden=false; return; }
  if(b.id==='closeM') document.getElementById('modal').hidden=true;
});
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') e.currentTarget.hidden=true; });
document.addEventListener('input',function(e){ if(e.target.id==='q') renderList(document.getElementById('view')); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') document.getElementById('modal').hidden=true;
  if(!session||!session.cur||/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(!session.flip&&(e.key===' '||e.key==='Enter')){e.preventDefault();session.flip=true;render();}
  else if(session.flip&&/^[1-4]$/.test(e.key)){rate(session.cur,+e.key-1);session={cur:nextCard(),flip:false};render();window.scrollTo(0,0);}
  else if(session.flip&&e.key===' '){e.preventDefault();rate(session.cur,2);session={cur:nextCard(),flip:false};render();window.scrollTo(0,0);}
});
/* 학습 카드가 몇 분 뒤 돌아오도록 잡혀 있으니, 화면에 다시 돌아오면 홈 숫자를 새로 계산 */
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!session&&view==='home') render(); });

/* ═══ 시작 ═══ */
load(); render();
fetch('words.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
  WORDS=d.words; WORDS.forEach(function(x){BY[x.w]=x;}); render();
}).catch(function(){ document.getElementById('view').innerHTML='<div class="empty">단어 파일을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>'; });
</script>
