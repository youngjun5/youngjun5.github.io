<style>
:root{
  color-scheme: dark;
  --ground:#0b0c0e; --surface:#15161a; --surface-2:#1c1e23;
  --hair:rgba(231,232,234,0.10); --hair-strong:rgba(231,232,234,0.20);
  --ink:#e7e8ea; --ink-soft:#9a9ea6; --ink-faint:#6b6f78;
  --accent:#5b6fd8; --accent-2:#8f9be8; --accent-soft:rgba(91,111,216,0.18);
  --bar:#d9dbe6; --today:#e2603f; --amber:#e0ab4c;
  --lane-h:46px; --label-w:210px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

.wrap{max-width:1360px;margin:0 auto;padding:22px clamp(14px,3.4vw,44px) 90px}

/* ── 상단바 ── */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13.5px;
  border:1px solid var(--hair);border-radius:99px;padding:6px 13px 6px 10px}
.back:hover{color:var(--ink);border-color:var(--hair-strong)}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:99px;
  padding:6px 13px;font-size:13px;color:var(--ink-soft)}
.pill.on{background:var(--accent-soft);border-color:rgba(91,111,216,.5);color:#cdd4f7}
.pill:hover{border-color:var(--hair-strong)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none}
.dot.sync{background:#57b98a}.dot.wait{background:var(--amber)}.dot.err{background:#d9604a}

/* ── 헤더 ── */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--accent-2);
  text-transform:uppercase;margin-bottom:14px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(26px,4.4vw,40px);
  margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1 .rangeTxt{color:var(--ink-faint);font-weight:600;font-size:.72em;letter-spacing:0}
.note{color:var(--ink-soft);max-width:74ch;margin:12px 0 0;font-size:14.5px;line-height:1.72;white-space:pre-wrap}
[contenteditable]:focus{outline:1px solid var(--accent);outline-offset:3px;border-radius:3px}

/* ── 타임라인 ── */
.chart{margin-top:34px;border-top:1px solid var(--hair-strong);overflow-x:auto;overflow-y:hidden}
.chart-inner{min-width:760px}
.months{display:flex;height:40px;align-items:center;border-bottom:1px solid var(--hair-strong);position:relative}
.months .mlabel{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:11px;
  font-size:12.5px;color:var(--ink-soft);border-left:1px solid var(--hair)}
.months .corner{width:var(--label-w);flex:none;font-size:12px;color:var(--ink-faint);padding-left:2px;
  display:flex;align-items:center}
.lanes{position:relative}
.grid{position:absolute;inset:0;left:var(--label-w);pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.todayline{position:absolute;top:-40px;bottom:0;width:1px;background:var(--today);opacity:.85;pointer-events:none;z-index:4}
.todaytag{position:absolute;top:3px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--today);border:1px solid var(--today);border-radius:4px;padding:1px 5px;
  background:var(--ground);white-space:nowrap;pointer-events:none;z-index:5}

.grp{padding-top:26px}
.grp:first-of-type{padding-top:34px}
.grp-head{display:flex;align-items:center;gap:8px;height:30px;padding-left:2px}
.grp-name{font-weight:600;font-size:14.5px;color:var(--accent-2);letter-spacing:-.005em}
.lane{position:relative;height:var(--lane-h);display:flex;align-items:center}
.lane:hover .lbl{color:var(--ink)}
.lbl{width:var(--label-w);flex:none;padding-right:16px;font-size:13.5px;color:var(--ink-soft);
  line-height:1.35;transition:color .12s}
.lane.cancelled .lbl{text-decoration:line-through;color:var(--ink-faint)}
.track{position:relative;flex:1;height:100%}

.bar{position:absolute;top:50%;transform:translateY(-50%);height:17px;border-radius:4px;
  background:var(--bar);min-width:5px;z-index:2}
.bar.active{background:var(--accent)}
.bar.due{background:var(--accent);box-shadow:0 0 0 1px rgba(143,155,232,.55) inset}
.bar.cancelled{background:transparent;border:1px solid var(--hair-strong);opacity:.55}
.bar .dates{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.bar.cancelled .dates{text-decoration:line-through}
.bar.flip .dates{left:auto;right:calc(100% + 9px)}
.track .ms{position:absolute;top:50%;width:15px;height:15px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--accent);border-radius:2px;z-index:3}
.track .ms.flip .dates{left:auto;right:14px;transform:rotate(-45deg) translate(-2px,2px)}
.track .ms .dates{position:absolute;left:14px;top:0;transform:rotate(-45deg) translate(2px,-2px);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}

/* 편집 모드 */
body.edit .bar,body.edit .track .ms{cursor:grab}
body.edit .bar,body.edit .track .ms,body.edit .bar .h{touch-action:none}
body.edit .bar:hover{box-shadow:0 0 0 2px var(--accent-2)}
body.edit .track .ms:hover{box-shadow:0 0 0 2px var(--accent-2)}
body.edit .bar.sel,body.edit .track .ms.sel{box-shadow:0 0 0 2px #fff}
.bar .h{position:absolute;top:0;bottom:0;width:9px;display:none}
.bar .h.l{left:-4px;cursor:ew-resize}.bar .h.r{right:-4px;cursor:ew-resize}
body.edit .bar .h{display:block}
.rowdel{display:none;margin-left:auto;color:var(--ink-faint);font-size:15px;padding:0 6px;line-height:1}
.rowdel:hover{color:#d9604a}
body.edit .rowdel{display:block}
.lane .lbl{display:flex;align-items:center}
.lane .lbltxt{flex:1}
.addrow,.addgrp{display:none;font-size:12.5px;color:var(--ink-faint);padding:5px 0 0 2px}
.addrow:hover,.addgrp:hover{color:var(--accent-2)}
body.edit .addrow,body.edit .addgrp{display:block}
body.edit .grp-head .rowdel{display:block}

/* 범례 */
.legend{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:26px 0 0;padding-left:2px;
  font-size:12.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:11px;border-radius:3px;background:var(--bar);flex:none}
.sw.active{background:var(--accent)}.sw.due{background:var(--accent)}
.sw.cancelled{background:transparent;border:1px solid var(--hair-strong)}
.sw.mstone{width:11px;height:11px;transform:rotate(45deg);background:var(--accent);border-radius:2px}

/* 주요 시점 */
.sec{margin-top:58px}
.sec h2{font-size:14px;color:var(--accent-2);font-weight:600;margin:0 0 14px;letter-spacing:-.005em}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:500;color:var(--ink-faint);font-size:12px;padding:0 14px 9px 0;
  border-bottom:1px solid var(--hair-strong)}
tbody td{padding:13px 14px 13px 0;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.5}
tbody tr:hover td{background:rgba(255,255,255,.015)}
td.when{color:var(--ink-faint);white-space:nowrap;font-size:13px}
td.proj{color:var(--accent-2);white-space:nowrap}
td.owner{color:var(--ink-soft);white-space:nowrap}
td.del{width:24px;padding-right:0}
.tbl-wrap{overflow-x:auto}
@media(max-width:640px){table{min-width:620px}}

/* 편집 패널 */
.panel{position:fixed;right:16px;bottom:16px;width:min(310px,calc(100vw - 32px));background:var(--surface);
  border:1px solid var(--hair-strong);border-radius:13px;padding:15px;z-index:50;display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
.panel.on{display:block}
.panel h3{margin:0 0 12px;font-size:13px;color:var(--ink-soft);font-weight:500}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--ink-faint);margin-bottom:4px}
.fld input,.fld select{width:100%;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:7px;padding:7px 9px;font-size:13.5px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.prow{display:flex;gap:8px}.prow .fld{flex:1}
.pacts{display:flex;gap:8px;margin-top:13px}
.pacts button{flex:1;border:1px solid var(--hair);border-radius:8px;padding:8px;font-size:13px;color:var(--ink-soft)}
.pacts button:hover{border-color:var(--hair-strong);color:var(--ink)}
.pacts button.danger:hover{border-color:#d9604a;color:#d9604a}

.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--hair-strong);border-radius:99px;padding:7px 16px;font-size:12.5px;
  color:var(--ink-soft);z-index:40;display:none;white-space:nowrap}
body.edit .hint{display:block}
@media(max-width:640px){.hint{display:none!important}}
</style>
</head>

<div class="wrap">

<div class="panel" id="panel">

    <div class="fld" id="pEndWrap"><label>종료</label><input id="pEnd" type="date"></div>
  </div>
  <div class="fld"><label>종류</label><select id="pKind">
    <option value="task">작업</option><option value="active">진행 중</option>
    <option value="due">마감 중요</option><option value="milestone">마일스톤</option>
    <option value="cancelled">취소</option></select></div>
  <div class="pacts"><button id="pDel" class="danger">삭제</button><button id="pClose">닫기</button></div>
</div>

<div class="hint">막대를 드래그해 옮기고, 양 끝을 끌어 늘려요 · 글자는 눌러서 바로 수정</div>

/* ═══ 상태 ═══ */
var S=seed(), rev=0, editing=false, sel=null, db=null, saveT=null, pulling=false;

/* ═══ 날짜 유틸 ═══ */
function D(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function days(a,b){return Math.round((D(b)-D(a))/86400000);}
function addDays(s,n){var d=D(s);d.setDate(d.getDate()+n);return iso(d);}
function span(){return Math.max(1,days(S.range.start,S.range.end));}
function pct(date){return days(S.range.start,date)/span()*100;}
function md(s){var p=String(s).split('-');return p[1]+'/'+p[2];}

  var a=D(S.range.start),b=D(S.range.end);
  document.getElementById('rangeTxt').textContent=
    a.getFullYear()+'.'+String(a.getMonth()+1).padStart(2,'0')+' – '+b.getFullYear()+'.'+String(b.getMonth()+1).padStart(2,'0');
  renderMonths(); renderLanes(); renderTable();
  setCE();
}

function monthMarks(){
  var out=[],d=new Date(D(S.range.start).getFullYear(),D(S.range.start).getMonth(),1),end=D(S.range.end);
  while(d<=end){
    var f=iso(d);
    out.push({at:Math.max(0,pct(f)),label:(d.getMonth()===0?d.getFullYear()+' · ':'')+(d.getMonth()+1)+'월'});
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return out;
}

function renderMonths(){
  var el=document.getElementById('months');
  el.innerHTML='<div class="corner">항목</div>';
  var marks=monthMarks();
  marks.forEach(function(m,i){
    var d=document.createElement('div');
    d.className='mlabel';
    d.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(m.at/100)+')';
    var nextAt=i+1<marks.length?marks[i+1].at:100;
    d.style.width='calc((100% - var(--label-w)) * '+((nextAt-m.at)/100)+')';
    d.textContent=m.label;
    el.appendChild(d);
  });
}

function renderLanes(){
  var el=document.getElementById('lanes');
  el.innerHTML='';
  var grid=document.createElement('div');
  grid.className='grid';
  monthMarks().forEach(function(m){
    var i=document.createElement('i');i.style.left=m.at+'%';grid.appendChild(i);
  });
  el.appendChild(grid);

  S.groups.forEach(function(g){
    var gd=document.createElement('div');gd.className='grp';
    var gh=document.createElement('div');gh.className='grp-head';
    var gn=document.createElement('div');gn.className='grp-name';gn.textContent=g.name;
    gn.dataset.grp=g.id;gn.dataset.f='name';
    gh.appendChild(gn);
    var gx=document.createElement('button');gx.className='rowdel';gx.textContent='×';gx.title='그룹 삭제';
    gx.onclick=function(){if(confirm('"'+g.name+'" 그룹을 통째로 지울까요?')){S.groups=S.groups.filter(function(x){return x!==g;});touch();}};
    gh.appendChild(gx);
    gd.appendChild(gh);

    g.rows.forEach(function(r){
      var ln=document.createElement('div');
      ln.className='lane'+(r.kind==='cancelled'?' cancelled':'');
      var lb=document.createElement('div');lb.className='lbl';
      var lt=document.createElement('span');lt.className='lbltxt';lt.textContent=r.label;
      lt.dataset.row=r.id;lt.dataset.f='label';
      lb.appendChild(lt);
      var rx=document.createElement('button');rx.className='rowdel';rx.textContent='×';
      rx.onclick=function(){g.rows=g.rows.filter(function(x){return x!==r;});touch();};
      lb.appendChild(rx);
      ln.appendChild(lb);

      var tr=document.createElement('div');tr.className='track';
      if(r.kind==='milestone'){
        var ms=document.createElement('div');
        ms.className='ms'+(sel===r.id?' sel':'')+(pct(r.start)>88?' flip':'');
        ms.style.left=pct(r.start)+'%';
        ms.innerHTML='<span class="dates">'+md(r.start)+'</span>';
        ms.dataset.row=r.id;tr.appendChild(ms);
      }else{
        var bar=document.createElement('div');
        bar.className='bar '+r.kind+(sel===r.id?' sel':'')+(pct(r.end)>80?' flip':'');
        bar.style.left=pct(r.start)+'%';
        bar.style.width=Math.max(0.35,(days(r.start,r.end)+1)/span()*100)+'%';
        bar.innerHTML='<span class="h l"></span><span class="h r"></span>'+
          '<span class="dates">'+md(r.start)+' – '+md(r.end)+'</span>';
        bar.dataset.row=r.id;tr.appendChild(bar);
      }
      ln.appendChild(tr);
      gd.appendChild(ln);
    });

    var ar=document.createElement('button');ar.className='addrow';ar.textContent='+ 일정 추가';
    ar.onclick=function(){
      var st=iso(new Date());
      g.rows.push({id:'r'+Date.now(),label:'새 일정',kind:'task',start:st,end:addDays(st,7)});
      touch();
    };
    gd.appendChild(ar);
    el.appendChild(gd);
  });

  var ag=document.createElement('button');ag.className='addgrp';ag.textContent='+ 프로젝트 추가';
  ag.style.marginTop='20px';
  ag.onclick=function(){S.groups.push({id:'g'+Date.now(),name:'새 프로젝트',rows:[]});touch();};
  el.appendChild(ag);

  var t=iso(new Date()),p=pct(t);
  if(p>=0&&p<=100){
    var tl=document.createElement('div');tl.className='todayline';
    tl.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(p/100)+')';
    var tg=document.createElement('div');tg.className='todaytag';
    tg.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(p/100)+')';
    tg.textContent='오늘 '+md(t);
    el.appendChild(tl);el.appendChild(tg);
  }
}

function renderTable(){
  var tb=document.getElementById('tbody');tb.innerHTML='';
  S.milestones.forEach(function(m){
    var tr=document.createElement('tr');
    [['when','when'],['what','what'],['proj','proj'],['owner','owner']].forEach(function(c){
      var td=document.createElement('td');td.className=c[0];
      td.textContent=m[c[1]];td.dataset.ms=m.id;td.dataset.f=c[1];
      tr.appendChild(td);
    });
    var td=document.createElement('td');td.className='del';
    var x=document.createElement('button');x.className='rowdel';x.textContent='×';
    x.onclick=function(){S.milestones=S.milestones.filter(function(y){return y!==m;});touch();};
    td.appendChild(x);tr.appendChild(td);
    tb.appendChild(tr);
  });
}

/* ═══ 인라인 편집 ═══ */
function setCE(){
  var sels='#title,#note,[data-grp],[data-row][data-f],[data-ms]';
  document.querySelectorAll(sels).forEach(function(el){
    if(editing){el.setAttribute('contenteditable','plaintext-only');}
    else{el.removeAttribute('contenteditable');}
  });
}
function findRow(id){
  for(var i=0;i<S.groups.length;i++){
    var rs=S.groups[i].rows;
    for(var j=0;j<rs.length;j++) if(rs[j].id===id) return rs[j];
  }
  return null;
}
document.addEventListener('blur',function(e){
  var el=e.target;if(!el.dataset||!editing)return;
  var v=el.textContent.trim();
  if(el.id==='title'){S.title=v;save();}
  else if(el.id==='note'){S.note=el.textContent;save();}
  else if(el.dataset.grp){var g=S.groups.filter(function(x){return x.id===el.dataset.grp;})[0];if(g){g.name=v;save();}}
  else if(el.dataset.row&&el.dataset.f==='label'){var r=findRow(el.dataset.row);if(r){r.label=v;save();}}
  else if(el.dataset.ms){var m=S.milestones.filter(function(x){return x.id===el.dataset.ms;})[0];if(m){m[el.dataset.f]=v;save();}}
},true);

/* ═══ 막대 드래그 ═══ */
var drag=null;
document.addEventListener('pointerdown',function(e){
  if(!editing)return;
  var el=e.target.closest('.bar,.ms');if(!el)return;
  var r=findRow(el.dataset.row);if(!r)return;
  e.preventDefault();
  var track=el.parentNode, w=track.getBoundingClientRect().width;
  var mode='move';
  if(e.target.classList.contains('h')) mode=e.target.classList.contains('l')?'l':'r';
  drag={r:r,el:el,mode:mode,x0:e.clientX,s0:r.start,e0:r.end,ppd:w/span(),moved:false};
  el.setPointerCapture&&el.setPointerCapture(e.pointerId);
},true);
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dd=Math.round((e.clientX-drag.x0)/drag.ppd);
  if(dd===0&&!drag.moved)return;
  drag.moved=true;
  var r=drag.r;
  if(drag.mode==='move'){r.start=addDays(drag.s0,dd);r.end=addDays(drag.e0,dd);}
  else if(drag.mode==='l'){var ns=addDays(drag.s0,dd);if(days(ns,r.end)>=0)r.start=ns;}
  else{var ne=addDays(drag.e0,dd);if(days(r.start,ne)>=0)r.end=ne;}
  liveBar(r,drag.el);
});
document.addEventListener('pointerup',function(){
  if(!drag)return;
  var moved=drag.moved,r=drag.r;drag=null;
  if(moved){save();render();}
  else{openPanel(r);}
});
function liveBar(r,el){
  el.style.left=pct(r.start)+'%';
  if(el.classList.contains('bar')){
    el.style.width=Math.max(0.35,(days(r.start,r.end)+1)/span()*100)+'%';
    el.querySelector('.dates').textContent=md(r.start)+' – '+md(r.end);
  }else{ el.querySelector('.dates').textContent=md(r.start); }
}

/* ═══ 패널 ═══ */
var P=document.getElementById('panel'),cur=null;
function openPanel(r){
  cur=r;sel=r.id;
  document.getElementById('pLabel').value=r.label;
  document.getElementById('pStart').value=r.start;
  document.getElementById('pEnd').value=r.end;
  document.getElementById('pKind').value=r.kind;
  document.getElementById('pEndWrap').style.visibility=r.kind==='milestone'?'hidden':'visible';
  P.classList.add('on');render();
}
function closePanel(){P.classList.remove('on');cur=null;sel=null;render();}
document.getElementById('pClose').onclick=closePanel;
document.getElementById('pDel').onclick=function(){
  if(!cur)return;
  S.groups.forEach(function(g){g.rows=g.rows.filter(function(x){return x!==cur;});});
  closePanel();touch();
};
['pLabel','pStart','pEnd','pKind'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){
    if(!cur)return;
    cur.label=document.getElementById('pLabel').value;
    cur.start=document.getElementById('pStart').value;
    cur.kind=document.getElementById('pKind').value;
    cur.end=cur.kind==='milestone'?cur.start:document.getElementById('pEnd').value;
    if(days(cur.start,cur.end)<0)cur.end=cur.start;
    document.getElementById('pEndWrap').style.visibility=cur.kind==='milestone'?'hidden':'visible';
    document.getElementById('pEnd').value=cur.end;
    touch();
  });
});

document.getElementById('addMs').onclick=function(){
  S.milestones.push({id:'m'+Date.now(),when:'날짜',what:'내용',proj:'프로젝트',owner:'담당'});touch();
};

/* ═══ 편집 토글 ═══ */
document.getElementById('editBtn').onclick=function(){
  editing=!editing;
  document.body.classList.toggle('edit',editing);
  this.classList.toggle('on',editing);
  this.textContent=editing?'편집 끝':'편집';
  if(!editing)closePanel();
  setCE();
};

/* ═══ 저장 ═══ */
function setStatus(cls,txt){
  var d=document.getElementById('dot');
  d.className='dot'+(cls?' '+cls:'');
  document.getElementById('statusTxt').textContent=txt;
}
function touch(){save();render();}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  setStatus('wait','저장 대기');
  clearTimeout(saveT);saveT=setTimeout(push,900);
}
function push(){
  if(!db){setStatus('err','오프라인 (이 기기에만 저장)');return;}
  setStatus('wait','저장 중');
  db.from(SB.table).upsert({id:SB.row,content:S,rev:rev+1,updated_at:new Date().toISOString()})
    .then(function(res){
      if(res.error){setStatus('err','저장 실패');console.error(res.error);}
      else{rev=rev+1;setStatus('sync','동기화됨');}
    });
}
function pull(){
  if(!db)return Promise.resolve();
  return db.from(SB.table).select('content,rev').eq('id',SB.row).maybeSingle().then(function(res){
    if(res.error){setStatus('err','불러오기 실패');return;}
    if(res.data&&res.data.content&&res.data.content.groups){
      S=res.data.content;rev=res.data.rev||0;
      try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
      setStatus('sync','동기화됨');
    }else{
      setStatus('wait','첫 저장 중');push();
    }
    render();
  });
}

/* ═══ 시작 ═══ */
(function(){
  try{var c=localStorage.getItem(LS_KEY);if(c){var p=JSON.parse(c);if(p&&p.groups)S=p;}}catch(e){}
  render();
  if(window.supabase&&window.supabase.createClient){
    db=window.supabase.createClient(SB.url,SB.anon);
    pull().then(function(){
      db.channel('cal').on('postgres_changes',
        {event:'*',schema:'public',table:SB.table,filter:'id=eq.'+SB.row},
        function(){ if(editing||drag)return; pull(); }).subscribe();
    });
  }else{ setStatus('err','오프라인 (이 기기에만 저장)'); }
})();
</script>
