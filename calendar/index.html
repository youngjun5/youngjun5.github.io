<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="description" content="CARECENTER 팀 달력 — 프로젝트 일정 타임라인">
<link rel="icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀 달력">
<title>팀 달력 · CARECENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

</script>
<style>
:root{
  color-scheme: dark;
  --ground:#0b0c0e; --surface:#15161a; --surface-2:#1c1e23;
  --hair:rgba(231,232,234,0.10); --hair-strong:rgba(231,232,234,0.20);
  --ink:#e7e8ea; --ink-soft:#9a9ea6; --ink-faint:#6b6f78;
  --accent:#5b6fd8; --accent-2:#8f9be8; --accent-soft:rgba(91,111,216,0.18);
  --bar:#d9dbe6; --bar-ink:#0b0c0e; --today:#e2603f; --amber:#e0ab4c;
  --hover:rgba(143,155,232,0.13); --rowhover:rgba(255,255,255,0.022);
  --lane-h:46px; --label-w:210px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#fcfcfd; --surface:#ffffff; --surface-2:#f3f4f7;
  --hair:rgba(18,20,26,0.10); --hair-strong:rgba(18,20,26,0.20);
  --ink:#191b20; --ink-soft:#5b616c; --ink-faint:#8d939e;
  --accent:#4d61d2; --accent-2:#3b4cb8; --accent-soft:rgba(77,97,210,0.12);
  --bar:#cfd3e0; --bar-ink:#191b20; --today:#d4573a; --amber:#b5811f;
  --hover:rgba(77,97,210,0.10); --rowhover:rgba(18,20,26,0.022);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

.wrap{max-width:1360px;margin:0 auto;padding:22px clamp(14px,3.4vw,44px) 110px}

/* ── 상단바 ── */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13.5px;
  border:1px solid var(--hair);border-radius:99px;padding:6px 13px 6px 10px}
.back:hover{color:var(--ink);border-color:var(--hair-strong)}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:99px;
  padding:6px 13px;font-size:13px;color:var(--ink-soft)}
.pill:hover{border-color:var(--hair-strong)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1px solid var(--hair);border-radius:99px;color:var(--ink-soft)}
.iconbtn:hover{border-color:var(--hair-strong);color:var(--ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none}
.dot.sync{background:#4caf80}.dot.wait{background:var(--amber)}.dot.err{background:#d9604a}
.sun{display:none}:root[data-theme="light"] .sun{display:block}
:root[data-theme="light"] .moon{display:none}

/* ── 헤더 ── */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--accent-2);
  text-transform:uppercase;margin-bottom:14px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(26px,4.4vw,40px);
  margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1 .rangeTxt{color:var(--ink-faint);font-weight:600;font-size:.72em;letter-spacing:0;cursor:pointer}
h1 .rangeTxt:hover{color:var(--accent-2)}
.note{color:var(--ink-soft);max-width:74ch;margin:12px 0 0;font-size:14.5px;line-height:1.72;white-space:pre-wrap}

/* 언제나 편집 가능 — 커서만 올리면 보이는 힌트 */
[contenteditable]{border-radius:4px;transition:background .12s,box-shadow .12s}
[contenteditable]:hover{background:var(--hover);box-shadow:0 0 0 4px var(--hover)}
[contenteditable]:focus{outline:none;background:var(--hover);box-shadow:0 0 0 4px var(--hover),inset 0 -1px 0 var(--accent)}
[contenteditable].empty:before{content:attr(data-ph);color:var(--ink-faint);opacity:.6}

/* ── 타임라인 ── */
.chart{margin-top:34px;border-top:1px solid var(--hair-strong);overflow-x:auto;overflow-y:hidden}
.chart-inner{min-width:760px}
.months{display:flex;height:40px;align-items:center;border-bottom:1px solid var(--hair-strong);position:relative}
.months .mlabel{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:11px;
  font-size:12.5px;color:var(--ink-soft);border-left:1px solid var(--hair)}
.months .corner{width:var(--label-w);flex:none;font-size:12px;color:var(--ink-faint);padding-left:2px;
  display:flex;align-items:center}
.lanes{position:relative}
.grid{position:absolute;inset:0;left:var(--label-w);pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.todayline{position:absolute;top:-40px;bottom:0;width:1px;background:var(--today);opacity:.85;pointer-events:none;z-index:4}
.todaytag{position:absolute;top:3px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--today);border:1px solid var(--today);border-radius:4px;padding:1px 5px;
  background:var(--ground);white-space:nowrap;pointer-events:none;z-index:5}

.grp{padding-top:26px}
.grp:first-of-type{padding-top:34px}
.grp-head{display:flex;align-items:center;gap:8px;height:30px;padding-left:2px}
.grp-name{font-weight:600;font-size:14.5px;color:var(--accent-2);letter-spacing:-.005em}
.lane{position:relative;height:var(--lane-h);display:flex;align-items:center}
.lbl{width:var(--label-w);flex:none;padding-right:14px;font-size:13.5px;color:var(--ink-soft);
  line-height:1.35;display:flex;align-items:center;gap:4px}
.lane:hover .lbl{color:var(--ink)}
.lane.cancelled .lbltxt{text-decoration:line-through;color:var(--ink-faint)}
.lbltxt{flex:1}
.track{position:relative;flex:1;height:100%}

.bar{position:absolute;top:50%;transform:translateY(-50%);height:17px;border-radius:4px;
  background:var(--bar);min-width:5px;z-index:2;cursor:grab;touch-action:none}
.bar.active{background:var(--accent)}
.bar.due{background:var(--accent);box-shadow:0 0 0 1px var(--accent-2) inset}
.bar.cancelled{background:transparent;border:1px solid var(--hair-strong);opacity:.55}
.bar.blocked{background:transparent;border:1px dashed var(--hair-strong);opacity:.7}
.bar:hover{box-shadow:0 0 0 2px var(--accent-2)}
.bar.sel{box-shadow:0 0 0 2px var(--accent-2)}
.bar .dates{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;pointer-events:none}
.bar.flip .dates{left:auto;right:calc(100% + 9px)}
.bar.cancelled .dates{text-decoration:line-through}
.bar .h{position:absolute;top:-3px;bottom:-3px;width:10px;touch-action:none}
.bar .h.l{left:-5px;cursor:ew-resize}.bar .h.r{right:-5px;cursor:ew-resize}
.track .ms{position:absolute;top:50%;width:15px;height:15px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--accent);border-radius:2px;z-index:3;cursor:grab;touch-action:none}
.track .ms:hover,.track .ms.sel{box-shadow:0 0 0 2px var(--accent-2)}
.track .ms.flip .dates{left:auto;right:14px;transform:rotate(-45deg) translate(-2px,2px)}
.track .ms .dates{position:absolute;left:14px;top:0;transform:rotate(-45deg) translate(2px,-2px);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;pointer-events:none}

.rowdel{opacity:0;color:var(--ink-faint);font-size:15px;padding:0 5px;line-height:1;flex:none;transition:opacity .12s}
.lane:hover .rowdel,.grp-head:hover .rowdel,tr:hover .rowdel{opacity:1}
.rowdel:hover{color:#d9604a}
.addrow,.addgrp{font-size:12.5px;color:var(--ink-faint);padding:6px 0 0 2px;opacity:.6;transition:opacity .12s,color .12s}
.addrow:hover,.addgrp:hover{color:var(--accent-2);opacity:1}

/* 범례 */
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:26px 0 0;padding-left:2px;
  font-size:12.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:11px;border-radius:3px;background:var(--bar);flex:none}
.sw.active,.sw.due{background:var(--accent)}
.sw.cancelled{background:transparent;border:1px solid var(--hair-strong)}
.sw.blocked{background:transparent;border:1px dashed var(--hair-strong)}
.sw.mstone{width:11px;height:11px;transform:rotate(45deg);background:var(--accent);border-radius:2px}

/* 주요 시점 */
.sec{margin-top:58px}
.sec h2{font-size:14px;color:var(--accent-2);font-weight:600;margin:0 0 6px;letter-spacing:-.005em}
.sec .sub{font-size:12.5px;color:var(--ink-faint);margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:500;color:var(--ink-faint);font-size:12px;padding:0 12px 9px 0;
  border-bottom:1px solid var(--hair-strong)}
tbody td{padding:12px 12px 12px 0;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.5}
tbody tr:hover td{background:var(--rowhover)}
tbody tr.cancelled .what-label{text-decoration:line-through;color:var(--ink-faint)}
td.when{color:var(--ink-faint);white-space:nowrap;font-size:12.5px;font-family:"IBM Plex Mono",monospace}
td.when .whenbtn{cursor:pointer;border-radius:4px;padding:2px 4px;margin:-2px -4px;display:inline-block}
td.when .whenbtn:hover{background:var(--hover);color:var(--ink)}
td.what .what-label{display:block}
td.what .what-detail{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:3px}
td.proj select{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 5px;
  margin:-3px -5px;font-size:13.5px;color:var(--accent-2);max-width:170px}
td.proj select:hover{background:var(--hover);border-color:var(--hair)}
td.owner{color:var(--ink-soft);white-space:nowrap}
td.del{width:26px;padding-right:0;text-align:right}
.tbl-wrap{overflow-x:auto}
.dateedit{display:flex;gap:5px;align-items:center}
.dateedit input{background:var(--surface-2);border:1px solid var(--hair);border-radius:6px;
  padding:3px 5px;font-size:12px;font-family:"IBM Plex Mono",monospace;width:122px}
@media(max-width:700px){table{min-width:640px}}

/* 편집 패널 */
.panel{position:fixed;right:16px;bottom:16px;width:min(310px,calc(100vw - 32px));background:var(--surface);
  border:1px solid var(--hair-strong);border-radius:13px;padding:15px;z-index:50;display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}
.panel.on{display:block}
.panel h3{margin:0 0 12px;font-size:13px;color:var(--ink-soft);font-weight:500}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--ink-faint);margin-bottom:4px}
.fld input,.fld select{width:100%;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:7px;padding:7px 9px;font-size:13.5px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.prow{display:flex;gap:8px}.prow .fld{flex:1}
.pacts{display:flex;gap:8px;margin-top:13px}
.pacts button{flex:1;border:1px solid var(--hair);border-radius:8px;padding:8px;font-size:13px;color:var(--ink-soft)}
.pacts button:hover{border-color:var(--hair-strong);color:var(--ink)}
.pacts button.danger:hover{border-color:#d9604a;color:#d9604a}

.foothint{margin-top:38px;font-size:12.5px;color:var(--ink-faint);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3L5 8l5 5"/></svg>
      스튜디오
    </a>
    <div class="spacer"></div>
    <div class="pill" id="status"><span class="dot" id="dot"></span><span id="statusTxt">불러오는 중</span></div>
    <button class="iconbtn" id="themeBtn" title="밝게 / 어둡게">
      <svg class="moon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 11.8A6.8 6.8 0 0 1 8.2 3.5a6.8 6.8 0 1 0 8.3 8.3z"/></svg>
      <svg class="sun" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M3.2 3.2l1.5 1.5M15.3 15.3l1.5 1.5M1.8 10h2.1M16.1 10h2.1M3.2 16.8l1.5-1.5M15.3 4.7l1.5-1.5"/></svg>
    </button>
  </div>

  <div class="eyebrow">CARECENTER · 팀 달력</div>
  <h1><span id="title" data-k="title"></span><span class="rangeTxt" id="rangeTxt" title="기간 바꾸기"></span></h1>
  <p class="note" id="note" data-k="note"></p>

  <div class="chart">
    <div class="chart-inner">
      <div class="months" id="months"></div>
      <div class="lanes" id="lanes"></div>
    </div>
  </div>

  <div class="legend">
    <span><i class="sw"></i>작업</span>
    <span><i class="sw active"></i>진행 중</span>
    <span><i class="sw due"></i>마감 중요</span>
    <span><i class="sw mstone"></i>마일스톤</span>
    <span><i class="sw blocked"></i>비워둠</span>
    <span><i class="sw cancelled"></i>취소</span>
  </div>

  <div class="sec">
    <h2>주요 시점</h2>
    <p class="sub">위 타임라인과 같은 내용입니다 — 여기서 고치면 타임라인도 같이 바뀝니다.</p>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:158px">시점</th><th>일정</th><th style="width:160px">프로젝트</th><th style="width:96px">담당</th><th class="del"></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <button class="addrow" id="addMs">+ 일정 추가</button>
  </div>

  <p class="foothint">막대를 끌어 옮기고, 양 끝을 끌어 기간을 조절해요 · 글자는 커서를 올리고 바로 누르면 수정됩니다 · 고치는 즉시 모두에게 저장됩니다</p>
</div>

<div class="panel" id="panel">
  <h3 id="panelTitle">일정 편집</h3>
  <div class="fld"><label>이름</label><input id="pLabel"></div>
  <div class="prow">
    <div class="fld"><label>시작</label><input id="pStart" type="date"></div>
    <div class="fld" id="pEndWrap"><label>종료</label><input id="pEnd" type="date"></div>
  </div>
  <div class="fld"><label>종류</label><select id="pKind">
    <option value="task">작업</option><option value="active">진행 중</option>
    <option value="due">마감 중요</option><option value="milestone">마일스톤</option>
    <option value="blocked">비워둠</option><option value="cancelled">취소</option></select></div>
  <div class="pacts"><button id="pDel" class="danger">삭제</button><button id="pClose">닫기</button></div>
</div>

    ]},
    {id:'g3',name:'아임파인 노 땡큐',rows:[
      {id:'r9',label:'파티룸 예약 · 멤버십 게시글',detail:'시사회 파티룸·멤버십 게시글',kind:'task',start:'2026-09-21',end:'2026-10-04',owner:'영준'},
      {id:'r10',label:'배우 프라이빗 시사회 (날짜 미정)',detail:'',kind:'task',start:'2026-10-05',end:'2026-10-11',owner:'–'}
    ]},
    {id:'g4',name:'약국 (구 콜택시)',rows:[
      {id:'r11',label:'기존 마감 (취소)',detail:'콜택시 기존 마감 → 취소, 백석대 양해',kind:'cancelled',start:'2026-10-31',end:'2026-11-01',owner:'목사님'},
      {id:'r12',label:'새 배우 물색 · 배우들 공지',detail:'',kind:'task',start:'2026-10-19',end:'2026-11-30',owner:'–'},
      {id:'r13',label:'약국 컨셉 제작 (한 달)',detail:'2월부터 제작 시작이면 한 달 소요',kind:'task',start:'2027-02-01',end:'2027-02-28',owner:'전체'},
      {id:'r14',label:'완성 목표 (2월 초 양해)',detail:'약국 완성 목표',kind:'milestone',start:'2027-02-08',end:'2027-02-08',owner:'전체'}
    ]}
  ]
};}

/* ═══ 상태 ═══ */
var S=seed(), rev=0, sel=null, db=null, saveT=null, pendingPull=false, drag=null;

/* ═══ 날짜 유틸 ═══ */
function D(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function days(a,b){return Math.round((D(b)-D(a))/86400000);}
function addDays(s,n){var d=D(s);d.setDate(d.getDate()+n);return iso(d);}
function span(){return Math.max(1,days(S.range.start,S.range.end));}
function pct(date){return days(S.range.start,date)/span()*100;}
function md(s){var p=String(s).split('-');return p[1]+'/'+p[2];}
function ymd(s){var p=String(s).split('-');return p[0]+'.'+p[1]+'.'+p[2];}
function whenText(r){
  if(r.kind==='milestone'||r.start===r.end) return ymd(r.start);
  var a=String(r.start).split('-'), b=String(r.end).split('-');
  return ymd(r.start)+' – '+(a[0]===b[0]? b[1]+'.'+b[2] : ymd(r.end));
}

/* ═══ 행 찾기 ═══ */
function allRows(){
  var out=[];
  S.groups.forEach(function(g){ g.rows.forEach(function(r){ out.push({g:g,r:r}); }); });
  return out;
}
function findRow(id){
  var f=allRows().filter(function(x){return x.r.id===id;})[0];
  return f?f.r:null;
}
function findPair(id){ return allRows().filter(function(x){return x.r.id===id;})[0]||null; }

/* ═══ 렌더 ═══ */
function render(){
  setText(document.getElementById('title'),S.title);
  setText(document.getElementById('note'),S.note);
  var a=D(S.range.start),b=D(S.range.end);
  document.getElementById('rangeTxt').textContent=
    a.getFullYear()+'.'+String(a.getMonth()+1).padStart(2,'0')+' – '+b.getFullYear()+'.'+String(b.getMonth()+1).padStart(2,'0');
  renderMonths(); renderLanes(); renderTable();
}
function setText(el,v){ el.textContent=v; }

function monthMarks(){
  var out=[],d=new Date(D(S.range.start).getFullYear(),D(S.range.start).getMonth(),1),end=D(S.range.end);
  while(d<=end){
    var f=iso(d);
    out.push({at:Math.max(0,pct(f)),label:(d.getMonth()===0?d.getFullYear()+' · ':'')+(d.getMonth()+1)+'월'});
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return out;
}
function renderMonths(){
  var el=document.getElementById('months');
  el.innerHTML='<div class="corner">항목</div>';
  var marks=monthMarks();
  marks.forEach(function(m,i){
    var d=document.createElement('div');
    d.className='mlabel';
    d.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(m.at/100)+')';
    var nextAt=i+1<marks.length?marks[i+1].at:100;
    d.style.width='calc((100% - var(--label-w)) * '+((nextAt-m.at)/100)+')';
    d.textContent=m.label;
    el.appendChild(d);
  });
}

function ce(el,ph){ el.setAttribute('contenteditable','plaintext-only'); if(ph)el.dataset.ph=ph; return el; }

function renderLanes(){
  var el=document.getElementById('lanes');
  el.innerHTML='';
  var grid=document.createElement('div');
  grid.className='grid';
  monthMarks().forEach(function(m){ var i=document.createElement('i');i.style.left=m.at+'%';grid.appendChild(i); });
  el.appendChild(grid);

  S.groups.forEach(function(g){
    var gd=document.createElement('div');gd.className='grp';
    var gh=document.createElement('div');gh.className='grp-head';
    var gn=document.createElement('div');gn.className='grp-name';gn.textContent=g.name;
    gn.dataset.grp=g.id;gn.dataset.f='name';ce(gn,'프로젝트 이름');
    gh.appendChild(gn);
    var gx=document.createElement('button');gx.className='rowdel';gx.textContent='×';gx.title='프로젝트 삭제';
    gx.onclick=function(){if(confirm('"'+g.name+'" 프로젝트를 통째로 지울까요?')){S.groups=S.groups.filter(function(x){return x!==g;});touch();}};
    gh.appendChild(gx);
    gd.appendChild(gh);

    g.rows.forEach(function(r){
      var ln=document.createElement('div');
      ln.className='lane'+(r.kind==='cancelled'?' cancelled':'');
      var lb=document.createElement('div');lb.className='lbl';
      var lt=document.createElement('span');lt.className='lbltxt';lt.textContent=r.label;
      lt.dataset.row=r.id;lt.dataset.f='label';ce(lt,'일정 이름');
      lb.appendChild(lt);
      var rx=document.createElement('button');rx.className='rowdel';rx.textContent='×';
      rx.onclick=function(){delRow(r);};
      lb.appendChild(rx);
      ln.appendChild(lb);

      var tr=document.createElement('div');tr.className='track';
      if(r.kind==='milestone'){
        var ms=document.createElement('div');
        ms.className='ms'+(sel===r.id?' sel':'')+(pct(r.start)>88?' flip':'');
        ms.style.left=pct(r.start)+'%';
        ms.innerHTML='<span class="dates">'+md(r.start)+'</span>';
        ms.dataset.row=r.id;tr.appendChild(ms);
      }else{
        var bar=document.createElement('div');
        bar.className='bar '+r.kind+(sel===r.id?' sel':'')+(pct(r.end)>80?' flip':'');
        bar.style.left=pct(r.start)+'%';
        bar.style.width=Math.max(0.35,(days(r.start,r.end)+1)/span()*100)+'%';
        bar.innerHTML='<span class="h l"></span><span class="h r"></span>'+
          '<span class="dates">'+md(r.start)+' – '+md(r.end)+'</span>';
        bar.dataset.row=r.id;tr.appendChild(bar);
      }
      ln.appendChild(tr);
      gd.appendChild(ln);
    });

    var ar=document.createElement('button');ar.className='addrow';ar.textContent='+ 일정 추가';
    ar.onclick=function(){ addRow(g); };
    gd.appendChild(ar);
    el.appendChild(gd);
  });

  var ag=document.createElement('button');ag.className='addgrp';ag.textContent='+ 프로젝트 추가';
  ag.style.marginTop='20px';
  ag.onclick=function(){S.groups.push({id:'g'+Date.now(),name:'새 프로젝트',rows:[]});touch();};
  el.appendChild(ag);

  var t=iso(new Date()),p=pct(t);
  if(p>=0&&p<=100){
    var tl=document.createElement('div');tl.className='todayline';
    tl.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(p/100)+')';
    var tg=document.createElement('div');tg.className='todaytag';
    tg.style.left='calc(var(--label-w) + (100% - var(--label-w)) * '+(p/100)+')';
    tg.textContent='오늘 '+md(t);
    el.appendChild(tl);el.appendChild(tg);
  }
}

function renderTable(){
  var tb=document.getElementById('tbody');tb.innerHTML='';
  var list=allRows().slice().sort(function(a,b){
    var d=days(b.r.start,a.r.start); if(d) return d>0?1:-1;
    return days(b.r.end,a.r.end)>0?1:-1;
  });
  list.forEach(function(x){
    var r=x.r,g=x.g;
    var tr=document.createElement('tr');
    if(r.kind==='cancelled')tr.className='cancelled';

    var tdW=document.createElement('td');tdW.className='when';
    var wb=document.createElement('span');wb.className='whenbtn';wb.textContent=whenText(r);
    wb.title='눌러서 날짜 바꾸기';
    wb.onclick=function(){ dateCell(tdW,r); };
    tdW.appendChild(wb);tr.appendChild(tdW);

    var tdL=document.createElement('td');tdL.className='what';
    var lab=document.createElement('span');lab.className='what-label';lab.textContent=r.label;
    lab.dataset.row=r.id;lab.dataset.f='label';ce(lab,'일정 이름');
    var det=document.createElement('span');det.className='what-detail';det.textContent=r.detail||'';
    det.dataset.row=r.id;det.dataset.f='detail';ce(det,'설명 추가');
    if(!r.detail)det.classList.add('empty');
    tdL.appendChild(lab);tdL.appendChild(det);tr.appendChild(tdL);

    var tdP=document.createElement('td');tdP.className='proj';
    var sl=document.createElement('select');
    S.groups.forEach(function(gg){
      var o=document.createElement('option');o.value=gg.id;o.textContent=gg.name;
      if(gg===g)o.selected=true;sl.appendChild(o);
    });
    sl.onchange=function(){ moveRow(r,sl.value); };
    tdP.appendChild(sl);tr.appendChild(tdP);

    var tdO=document.createElement('td');tdO.className='owner';
    tdO.textContent=r.owner||'';tdO.dataset.row=r.id;tdO.dataset.f='owner';ce(tdO,'담당');
    if(!r.owner)tdO.classList.add('empty');
    tr.appendChild(tdO);

    var tdD=document.createElement('td');tdD.className='del';
    var x2=document.createElement('button');x2.className='rowdel';x2.textContent='×';
    x2.onclick=function(){delRow(r);};
    tdD.appendChild(x2);tr.appendChild(tdD);

    tb.appendChild(tr);
  });
}

function dateCell(td,r){
  td.innerHTML='';
  var box=document.createElement('div');box.className='dateedit';
  var i1=document.createElement('input');i1.type='date';i1.value=r.start;
  box.appendChild(i1);
  var i2=null;
  if(r.kind!=='milestone'){
    var dash=document.createElement('span');dash.textContent='–';dash.style.color='var(--ink-faint)';
    box.appendChild(dash);
    i2=document.createElement('input');i2.type='date';i2.value=r.end;box.appendChild(i2);
  }
  function commit(){
    r.start=i1.value||r.start;
    r.end=i2?(i2.value||r.end):r.start;
    if(days(r.start,r.end)<0)r.end=r.start;
    touch();
  }
  i1.onchange=commit; if(i2)i2.onchange=commit;
  box.addEventListener('focusout',function(){
    setTimeout(function(){ if(!box.contains(document.activeElement)) render(); },60);
  });
  td.appendChild(box);
  i1.focus();
}

/* ═══ 행 조작 ═══ */
function addRow(g){
  var st=iso(new Date());
  g.rows.push({id:'r'+Date.now(),label:'새 일정',detail:'',kind:'task',start:st,end:addDays(st,7),owner:''});
  touch();
}
function delRow(r){
  S.groups.forEach(function(g){ g.rows=g.rows.filter(function(x){return x!==r;}); });
  if(sel===r.id){sel=null;P.classList.remove('on');}
  touch();
}
function moveRow(r,gid){
  var to=S.groups.filter(function(g){return g.id===gid;})[0];
  if(!to)return;
  S.groups.forEach(function(g){ g.rows=g.rows.filter(function(x){return x!==r;}); });
  to.rows.push(r);
  touch();
}

/* ═══ 인라인 편집 — 언제나 가능, 두 시트 동시 반영 ═══ */
function applyEdit(el){
  var v=el.textContent.replace(/\n+$/,'');
  if(el.id==='title'){S.title=v.trim();}
  else if(el.id==='note'){S.note=v;}
  else if(el.dataset.grp){
    var g=S.groups.filter(function(x){return x.id===el.dataset.grp;})[0];
    if(g){g.name=v.trim(); syncGroupName(g);}
  }
  else if(el.dataset.row){
    var r=findRow(el.dataset.row); if(!r)return;
    r[el.dataset.f]= el.dataset.f==='detail'? v : v.trim();
    syncMirrors(el);
  }
  save();
}
/* 같은 값을 보여주는 다른 시트의 칸을 즉시 따라 바꿈 (포커스/커서는 그대로) */
function syncMirrors(el){
  var q='[data-row="'+el.dataset.row+'"][data-f="'+el.dataset.f+'"]';
  document.querySelectorAll(q).forEach(function(o){
    if(o!==el && o.textContent!==el.textContent) o.textContent=el.textContent;
    o.classList.toggle('empty',!o.textContent);
  });
}
function syncGroupName(g){
  document.querySelectorAll('[data-grp="'+g.id+'"]').forEach(function(o){
    if(o.textContent!==g.name) o.textContent=g.name;
  });
  document.querySelectorAll('td.proj select').forEach(function(sl){
    [].forEach.call(sl.options,function(o){ if(o.value===g.id) o.textContent=g.name; });
  });
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el&&el.isContentEditable) applyEdit(el);
},true);
document.addEventListener('blur',function(e){
  var el=e.target;
  if(el&&el.isContentEditable){
    applyEdit(el);
    el.classList.toggle('empty',!el.textContent);
    if(pendingPull&&!busy()){pendingPull=false;pull();}
  }
},true);
/* 줄바꿈 대신 편집 종료 */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.isContentEditable&&e.target.id!=='note'){
    e.preventDefault();e.target.blur();
  }
  if(e.key==='Escape'&&e.target&&e.target.isContentEditable) e.target.blur();
});

/* ═══ 막대 드래그 ═══ */
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest?e.target.closest('.bar,.track .ms'):null;
  if(!el)return;
  var r=findRow(el.dataset.row);if(!r)return;
  e.preventDefault();
  var track=el.parentNode, w=track.getBoundingClientRect().width;
  var mode='move';
  if(e.target.classList&&e.target.classList.contains('h')) mode=e.target.classList.contains('l')?'l':'r';
  drag={r:r,el:el,mode:mode,x0:e.clientX,s0:r.start,e0:r.end,ppd:w/span(),moved:false};
  if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId);}catch(err){}
},true);
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dd=Math.round((e.clientX-drag.x0)/drag.ppd);
  if(dd===0&&!drag.moved)return;
  drag.moved=true;
  var r=drag.r;
  if(drag.mode==='move'){r.start=addDays(drag.s0,dd);r.end=addDays(drag.e0,dd);}
  else if(drag.mode==='l'){var ns=addDays(drag.s0,dd);if(days(ns,r.end)>=0)r.start=ns;}
  else{var ne=addDays(drag.e0,dd);if(days(r.start,ne)>=0)r.end=ne;}
  liveBar(r,drag.el);
});
document.addEventListener('pointerup',function(){
  if(!drag)return;
  var moved=drag.moved,r=drag.r;drag=null;
  if(moved){save();render();}
  else{openPanel(r);}
});
function liveBar(r,el){
  el.style.left=pct(r.start)+'%';
  if(el.classList.contains('bar')){
    el.style.width=Math.max(0.35,(days(r.start,r.end)+1)/span()*100)+'%';
    el.querySelector('.dates').textContent=md(r.start)+' – '+md(r.end);
  }else{ el.querySelector('.dates').textContent=md(r.start); }
}

/* ═══ 패널 ═══ */
var P=document.getElementById('panel'),cur=null;
function openPanel(r){
  cur=r;sel=r.id;
  document.getElementById('pLabel').value=r.label;
  document.getElementById('pStart').value=r.start;
  document.getElementById('pEnd').value=r.end;
  document.getElementById('pKind').value=r.kind;
  document.getElementById('pEndWrap').style.visibility=r.kind==='milestone'?'hidden':'visible';
  P.classList.add('on');render();
}
function closePanel(){P.classList.remove('on');cur=null;sel=null;render();}
document.getElementById('pClose').onclick=closePanel;
document.getElementById('pDel').onclick=function(){ if(cur)delRow(cur); };
['pLabel','pStart','pEnd','pKind'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){
    if(!cur)return;
    cur.label=document.getElementById('pLabel').value;
    cur.start=document.getElementById('pStart').value||cur.start;
    cur.kind=document.getElementById('pKind').value;
    cur.end=cur.kind==='milestone'?cur.start:(document.getElementById('pEnd').value||cur.end);
    if(days(cur.start,cur.end)<0)cur.end=cur.start;
    document.getElementById('pEndWrap').style.visibility=cur.kind==='milestone'?'hidden':'visible';
    document.getElementById('pEnd').value=cur.end;
    touch();
  });
});

document.getElementById('addMs').onclick=function(){
  addRow(S.groups[S.groups.length-1]||(S.groups[0]));
};

/* 기간 바꾸기 */
document.getElementById('rangeTxt').onclick=function(){
  var a=prompt('타임라인 시작 (YYYY-MM-DD)',S.range.start); if(!a)return;
  var b=prompt('타임라인 끝 (YYYY-MM-DD)',S.range.end); if(!b)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b)||days(a,b)<=0){alert('날짜 형식을 확인해 주세요.');return;}
  S.range={start:a,end:b};touch();
};

/* ═══ 테마 ═══ */
document.getElementById('themeBtn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',cur);
  document.querySelector('meta[name=theme-color]').setAttribute('content',cur==='light'?'#fcfcfd':'#0b0c0e');
  try{localStorage.setItem('carecal:theme',cur);}catch(e){}
};
(function(){
  var t=document.documentElement.getAttribute('data-theme')||'dark';
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='light'?'#fcfcfd':'#0b0c0e');
})();

/* ═══ 저장 ═══ */
function busy(){
  var a=document.activeElement;
  return !!drag || !!(a&&(a.isContentEditable||a.tagName==='INPUT'||a.tagName==='SELECT'));
}
function setStatus(cls,txt){
  document.getElementById('dot').className='dot'+(cls?' '+cls:'');
  document.getElementById('statusTxt').textContent=txt;
}
function touch(){save();render();}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  setStatus('wait','저장 대기');
  clearTimeout(saveT);saveT=setTimeout(push,900);
}
function push(){
  if(!db){setStatus('err','오프라인 (이 기기에만 저장)');return;}
  setStatus('wait','저장 중');
  S.schema=SCHEMA;
  db.from(SB.table).upsert({id:SB.row,content:S,rev:rev+1,updated_at:new Date().toISOString()})
    .then(function(res){
      if(res.error){setStatus('err','저장 실패');console.error(res.error);}
      else{rev=rev+1;setStatus('sync','동기화됨');}
    });
}
function pull(){
  if(!db)return Promise.resolve();
  return db.from(SB.table).select('content,rev').eq('id',SB.row).maybeSingle().then(function(res){
    if(res.error){setStatus('err','불러오기 실패');return;}
    var c=res.data&&res.data.content;
    if(c&&c.groups&&c.schema===SCHEMA){
      S=c;rev=res.data.rev||0;
      try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
      setStatus('sync','동기화됨');render();
    }else{
      rev=res.data?(res.data.rev||0):0;
      setStatus('wait','첫 저장 중');push();render();
    }
  });
}

/* ═══ 시작 ═══ */
(function(){
  try{var c=localStorage.getItem(LS_KEY);if(c){var p=JSON.parse(c);if(p&&p.groups&&p.schema===SCHEMA)S=p;}}catch(e){}
  render();
  if(window.supabase&&window.supabase.createClient){
    db=window.supabase.createClient(SB.url,SB.anon);
    pull().then(function(){
      db.channel('cal').on('postgres_changes',
        {event:'*',schema:'public',table:SB.table,filter:'id=eq.'+SB.row},
        function(){ if(busy()){pendingPull=true;return;} pull(); }).subscribe();
    });
  }else{ setStatus('err','오프라인 (이 기기에만 저장)'); }
})();
</script>
