<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="description" content="CARECENTER — 돌보고, 변화시켜, 삶의 모든 영역을 예수 그리스도처럼. 팀이 쓰는 도구를 한곳에">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CARECENTER">
<title>CARECENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --grid-line: rgba(230,231,233,0.05);
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --accent-ink: #0d1520;
    --amber: #9aa0a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 28px clamp(20px, 5vw, 56px) 0;
  }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--surface); border: 1px solid var(--hair-strong);
    padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
  .wordmark {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.01em;
  }
  .wordmark .dot { color: var(--ink-faint); }
  header .owner {
    margin-left: auto; font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  main { padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px) 64px; max-width: 1080px; margin: 0 auto; }

  /* ── 비전 히어로 ── */
  .hero { max-width: 840px; margin-bottom: clamp(40px, 7vw, 72px); }
  .hero h1 { margin: 0; }
  .hero .vsub:first-child { margin-top: 0; }
  .hero .vline {
    display: block;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(29px, 7.2vw, 54px); line-height: 1.04; letter-spacing: -0.021em;
    text-wrap: balance; color: var(--ink-faint);
  }
  .hero .vline em { font-style: normal; color: var(--accent); }
  .hero .vsub {
    display: block; margin-top: clamp(11px, 1.8vw, 16px);
    font: 600 clamp(11.5px, 2.2vw, 14px) "IBM Plex Sans", sans-serif;
    letter-spacing: 0.15em; line-height: 1.7; color: var(--ink-faint);
  }
  .hero .vko {
    margin: clamp(16px, 2.6vw, 22px) 0 0; max-width: 40ch;
    font-size: clamp(14px, 2.6vw, 16px); line-height: 1.75; color: var(--ink-soft);
    text-wrap: pretty;
  }

  /* ── 다가오는 일정 (팀 달력 요약, 앱 들어가자마자 바로 보이게) ── */
  .agenda {
    display: block; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    padding: 16px 18px; margin-bottom: clamp(24px, 4vw, 34px);
    transition: border-color .15s ease, background .15s ease;
  }
  .agenda:hover { border-color: var(--hair-strong); background: var(--surface-2); }
  .agenda[hidden] { display: none; }
  .agenda .ahead {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .agenda .ahead .arrow2 { margin-left: auto; color: var(--ink-faint); }
  .agenda:hover .ahead .arrow2 { color: var(--ink); }
  .agenda .arow { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 13.5px; }
  .agenda .arow + .arow { border-top: 1px solid var(--hair); }
  .agenda .arow .adot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); flex: none; align-self: center; }
  .agenda .arow .adot.soon { background: #d98a6e; }
  .agenda .arow .aproj { color: var(--ink-faint); font-size: 11.5px; white-space: nowrap; }
  .agenda .arow .atitle { color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agenda .arow .add { font: 600 11px "IBM Plex Mono", monospace; color: var(--ink-faint); flex: none; }
  .agenda .arow .add.soon { color: #d98a6e; }
  .agenda .aempty { color: var(--ink-faint); font-size: 13px; }

  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

  .room {
    position: relative; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    padding: 20px; min-height: 150px;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  a.room:hover { border-color: var(--hair-strong); transform: translateY(-2px); background: var(--surface-2); }
  a.room:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 2px; }

  .room-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex: none;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .room-icon svg { width: 19px; height: 19px; }
  .room.disabled .room-icon { background: var(--surface-2); color: var(--ink-faint); }

  .room-body { flex: 1 1 auto; }
  .room-title {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px;
    margin: 0 0 6px; color: var(--ink);
  }
  .room.disabled .room-title { color: var(--ink-soft); }
  .room-desc { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .room.disabled .room-desc { color: var(--ink-faint); }

  .room-foot { display: flex; align-items: center; justify-content: space-between; }
  .status {
    font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .status.live { color: var(--ink-soft); background: rgba(231,232,234,0.07); }
  .status.soon { color: var(--ink-faint); background: rgba(231,232,234,0.05); }

  .arrow { color: var(--ink-faint); transition: transform .15s ease, color .15s ease; }
  a.room:hover .arrow { color: var(--ink); transform: translateX(2px); }

  footer {
    padding: 20px clamp(20px, 5vw, 56px) 40px; color: var(--ink-faint); font-size: 12px;
    max-width: 1080px; margin: 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001s !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark"><img src="./mark-256.png" alt=""></div>
  <span class="wordmark">CARECENTER<span class="dot">.</span></span>
  <span class="owner">youngjun</span>
</header>

<main>
  <section class="hero">
    <h1>
      <span class="vline">TO <em>CARE</em>, <em>CHANGE</em>, AND <em>CONQUER</em></span>
      <span class="vsub">EVERY CORNER OF OUR LIVES<br>LIKE JESUS CHRIST</span>
    </h1>
  </section>

  <a class="agenda" id="agenda" href="https://youngjun5.github.io/calendar/" hidden>
    <div class="ahead">다가오는 일정<span class="arrow2">→</span></div>
    <div id="agendaBody"><p class="aempty">불러오는 중...</p></div>
  </a>

  <div class="rooms" id="rooms"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
  (function () {
    var SB = {
      url: 'https://mgvqhrdhshpuamihfvnp.supabase.co',
      anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ndnFocmRoc2hwdWFtaWhmdm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTE4NjQsImV4cCI6MjEwNDE4Nzg2NH0.fjDJuG-47YHU63lydUSZGAGg3FQ-DLGLp9ufnJ4SN30',
      table: 'carescript', row: 'team-calendar'
    };
    function D(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function iso(d) { var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
    function days(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
    function md(s) { var p = String(s).split('-'); return p[1] + '/' + p[2]; }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }
    function keyDate(r) { return r.kind === 'milestone' ? r.start : r.end; }
    function openRow(r) { return !r.done && r.kind !== 'cancelled' && r.kind !== 'blocked'; }
    function dday(d) {
      var n = days(iso(new Date()), d);
      if (n === 0) return '오늘';
      if (n === 1) return '내일';
      if (n < 0) return (-n) + '일 지남';
      return 'D-' + n;
    }

    function renderAgenda(S) {
      var box = document.getElementById('agendaBody');
      if (!S || !S.groups) { box.innerHTML = '<p class="aempty">아직 등록된 일정이 없어요.</p>'; return; }
      var all = [];
      S.groups.forEach(function (g) { g.rows.forEach(function (r) { all.push({ g: g, r: r }); }); });
      var open = all.filter(function (x) { return openRow(x.r); });

      var now = open.filter(function (x) { return days(iso(new Date()), x.r.start) <= 0 && days(iso(new Date()), x.r.end) >= 0; });
      var fut = open.filter(function (x) { return days(iso(new Date()), keyDate(x.r)) > 0; })
                    .sort(function (a, b) { return days(keyDate(a.r), keyDate(b.r)); });
      var late = open.filter(function (x) { return days(iso(new Date()), keyDate(x.r)) < 0; })
                     .sort(function (a, b) { return days(keyDate(b.r), keyDate(a.r)); });

      var picks = now.slice(0, 2).concat(fut.slice(0, 3)).slice(0, 4);
      if (!picks.length && late.length) picks = late.slice(0, 2);

      if (!picks.length) { box.innerHTML = '<p class="aempty">지금 진행 중이거나 다가오는 일정이 없어요.</p>'; return; }

      box.innerHTML = picks.map(function (x) {
        var d = keyDate(x.r), dd = dday(d), n = days(iso(new Date()), d);
        var soon = n <= 2;
        return '<div class="arow"><span class="adot' + (soon ? ' soon' : '') + '"></span>' +
          '<span class="aproj">' + esc(x.g.name) + '</span>' +
          '<span class="atitle">' + esc(x.r.label) + '</span>' +
          '<span class="add' + (soon ? ' soon' : '') + '">' + dd + '</span></div>';
      }).join('');
    }

    if (window.supabase && window.supabase.createClient) {
      var db = window.supabase.createClient(SB.url, SB.anon);
      function pull() {
        db.from(SB.table).select('content').eq('id', SB.row).maybeSingle().then(function (res) {
          document.getElementById('agenda').hidden = false;
          if (res.error || !res.data) { document.getElementById('agendaBody').innerHTML = '<p class="aempty">불러오지 못했어요.</p>'; return; }
          renderAgenda(res.data.content);
        });
      }
      pull();
      db.channel('hub-agenda').on('postgres_changes', { event: '*', schema: 'public', table: SB.table, filter: 'id=eq.' + SB.row }, pull).subscribe();
    }
  })();
</script>
<script>
  var ICONS = {
    note: '<path d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M6.5 7h7M6.5 10h7M6.5 13h4"/>',
    video: '<rect x="2.5" y="5.5" width="10" height="9" rx="1.6"/><path d="M12.5 9l4.5-2.6v7.2L12.5 11"/>',
    lang: '<circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c1.8 1.9 2.8 4.4 2.8 7s-1 5.1-2.8 7c-1.8-1.9-2.8-4.4-2.8-7s1-5.1 2.8-7z"/>',
    gear: '<path d="M10 2.5v3M10 14.5v3M4.9 4.9l2.1 2.1M13 13l2.1 2.1M2.5 10h3M14.5 10h3M4.9 15.1L7 13M13 7l2.1-2.1"/><circle cx="10" cy="10" r="3.4"/>',
    clapper: '<path d="M3 8.5L4 5h12l1 3.5"/><path d="M3 8.5h14v6.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5z"/><path d="M4.6 5l2 3M8.4 5l2 3M12.2 5l2 3"/>',
    scroll: '<path d="M6 3.5h9a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H6"/><path d="M6 3.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2"/><path d="M8 7.5h6M8 10h6M8 12.5h4"/>',
    script: '<path d="M7 2.5h7.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V5"/><path d="M4.5 5V3.5a1 1 0 0 1 1-1H7v3H5.5a1 1 0 0 1-1-1z"/><path d="M8 8h5M8 11h5M8 14h3"/>',
    calendar: '<rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2"/><path d="M6.2 11.5h2M6.2 14h2M11.8 11.5h2"/>',
    faces: '<circle cx="7" cy="8" r="3.4"/><path d="M2.5 17c0-2.8 2-4.6 4.5-4.6s4.5 1.8 4.5 4.6"/><path d="M13.5 5.2c1.1.3 2 1.4 2 2.8s-.9 2.5-2 2.8M13 12.6c1.9.4 3.5 2 3.5 4.4"/>',
    plus: '<path d="M10 4v12M4 10h12"/>'
  };

  var ROOMS = [
    {
      title: "케어노트",
      desc: "콘티·기획을 모으는 팀 보드",
      href: "https://youngjun5.github.io/carenote/",
      icon: "note",
      status: "live"
    },
    {
      title: "팀 달력",
      desc: "프로젝트 일정 타임라인",
      href: "https://youngjun5.github.io/calendar/",
      icon: "calendar",
      status: "live"
    },
    {
      title: "장비",
      desc: "촬영 장비 목록",
      href: "https://youngjun5.github.io/gear/",
      icon: "gear",
      status: "live"
    },
    {
      title: "촬영",
      desc: "프로젝트별 촬영 지시서",
      href: "https://youngjun5.github.io/shoots/",
      icon: "clapper",
      status: "live"
    },
    {
      title: "케어스크립트",
      desc: "촬영 현장 기록용 스크립터",
      href: "https://youngjun5.github.io/carescript/",
      icon: "script",
      status: "live"
    },
    {
      title: "토라포션",
      desc: "주차별 토라 포션 묵상",
      href: "https://youngjun5.github.io/torah/",
      icon: "scroll",
      status: "live"
    },
    {
      title: "영어 공부방",
      desc: "하루 한 문장 영어 훈련",
      href: "https://youngjun5.github.io/english/",
      icon: "lang",
      status: "live"
    },
    {
      title: "화상채팅",
      desc: "팀 화상회의 룸",
      href: "https://carecenter-meet.youngjun981221.workers.dev/",
      icon: "video",
      status: "live"
    },
    {
      title: "캐릭터 시트",
      desc: "인물·캐릭터 사진으로 참고 시트 만들기",
      href: "https://youngjun5.github.io/charsheet/",
      icon: "faces",
      status: "live"
    }
  ];

  var wrap = document.getElementById("rooms");
  ROOMS.forEach(function (r) {
    var disabled = !r.href;
    var el = document.createElement(disabled ? "div" : "a");
    el.className = "room" + (disabled ? " disabled" : "");
    if (!disabled) { el.href = r.href; }
    el.innerHTML =
      '<div class="room-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + ICONS[r.icon] + '</svg></div>' +
      '<div class="room-body"><h2 class="room-title"></h2><p class="room-desc"></p></div>' +
      '<div class="room-foot"><span class="status ' + r.status + '"></span>' +
      (disabled ? '' : '<svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>') +
      '</div>';
    el.querySelector(".room-title").textContent = r.title;
    el.querySelector(".room-desc").textContent = r.desc;
    el.querySelector(".status").textContent = r.status === "live" ? "열려있음" : "준비 중";
    wrap.appendChild(el);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js").catch(function () {});
    });
  }
</script>
