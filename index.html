<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="description" content="개인 제작 도구 스튜디오 — 케어노트, 화상채팅 등 모든 도구가 모이는 곳">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDIO">
<title>STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --grid-line: rgba(230,231,233,0.05);
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --accent-ink: #0d1520;
    --amber: #e0ab4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 28px clamp(20px, 5vw, 56px) 0;
  }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--surface); border: 1px solid var(--hair-strong);
    padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
  .wordmark {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.01em;
  }
  .wordmark .dot { color: var(--accent); }
  header .owner {
    margin-left: auto; font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  main { padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px) 64px; max-width: 1080px; margin: 0 auto; }

  .intro { max-width: 640px; margin-bottom: clamp(28px, 5vw, 44px); }
  .intro .eyebrow {
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .intro h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(26px, 4vw, 36px); line-height: 1.18; margin: 0 0 12px;
    text-wrap: balance;
  }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14.5px; max-width: 52ch; }

  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

  .room {
    position: relative; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    padding: 20px; min-height: 168px;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  a.room:hover { border-color: var(--hair-strong); transform: translateY(-2px); background: var(--surface-2); }
  a.room:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .room-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .room-icon svg { width: 19px; height: 19px; }
  .room.disabled .room-icon { background: var(--surface-2); color: var(--ink-faint); }

  .room-body { flex: 1 1 auto; }
  .room-title {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px;
    margin: 0 0 6px; color: var(--ink);
  }
  .room.disabled .room-title { color: var(--ink-soft); }
  .room-desc { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .room.disabled .room-desc { color: var(--ink-faint); }

  .room-foot { display: flex; align-items: center; justify-content: space-between; }
  .status {
    font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .status.live { color: #6fbf85; background: rgba(111,191,133,0.12); }
  .status.soon { color: var(--amber); background: rgba(224,171,76,0.12); }

  .arrow { color: var(--ink-faint); transition: transform .15s ease, color .15s ease; }
  a.room:hover .arrow { color: var(--accent); transform: translateX(2px); }

  footer {
    padding: 20px clamp(20px, 5vw, 56px) 40px; color: var(--ink-faint); font-size: 12px;
    max-width: 1080px; margin: 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001s !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark"><img src="./mark-256.png" alt=""></div>
  <span class="wordmark">STUDIO<span class="dot">.</span></span>
  <span class="owner">youngjun</span>
</header>

<main>
  <div class="intro">
    <p class="eyebrow">개인 도구 모음</p>
    <h1>여기서 필요한 걸 골라 들어가세요</h1>
    <p>팀에서 쓰는 도구들을 한곳에 모아뒀습니다. 카드를 누르면 해당 앱으로 이동해요.</p>
  </div>

  <div class="rooms" id="rooms"></div>
</main>

<footer>이 화면 자체도 홈 화면에 설치할 수 있어요 — 브라우저 메뉴에서 "설치" 또는 "홈 화면에 추가"를 찾아보세요.</footer>

<script>
  var ICONS = {
    note: '<path d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M6.5 7h7M6.5 10h7M6.5 13h4"/>',
    video: '<rect x="2.5" y="5.5" width="10" height="9" rx="1.6"/><path d="M12.5 9l4.5-2.6v7.2L12.5 11"/>',
    lang: '<circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c1.8 1.9 2.8 4.4 2.8 7s-1 5.1-2.8 7c-1.8-1.9-2.8-4.4-2.8-7s1-5.1 2.8-7z"/>',
    gear: '<path d="M10 2.5v3M10 14.5v3M4.9 4.9l2.1 2.1M13 13l2.1 2.1M2.5 10h3M14.5 10h3M4.9 15.1L7 13M13 7l2.1-2.1"/><circle cx="10" cy="10" r="3.4"/>',
    clapper: '<path d="M3 8.5L4 5h12l1 3.5"/><path d="M3 8.5h14v6.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5z"/><path d="M4.6 5l2 3M8.4 5l2 3M12.2 5l2 3"/>',
    scroll: '<path d="M6 3.5h9a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H6"/><path d="M6 3.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2"/><path d="M8 7.5h6M8 10h6M8 12.5h4"/>',
    plus: '<path d="M10 4v12M4 10h12"/>'
  };

  var ROOMS = [
    {
      title: "케어노트",
      desc: "팀 비주얼 보드 — 콘티·기획 정리, 실시간 공유",
      href: "https://youngjun5.github.io/carenote/",
      icon: "note",
      status: "live"
    },
    {
      title: "장비",
      desc: "CARECENTER GEAR — 촬영 장비 목록, 카테고리·사진으로 바로 확인",
      href: "https://youngjun5.github.io/gear/",
      icon: "gear",
      status: "live"
    },
    {
      title: "촬영",
      desc: "CARECENTER 촬영 — 프로젝트별 작전 지시서, 타임테이블·포지션·장비",
      href: "https://youngjun5.github.io/shoots/",
      icon: "clapper",
      status: "live"
    },
    {
      title: "토라포션",
      desc: "CARECENTER 토라포션 — 주차별 토라 포션 묵상, 히브리 절기, 오메르 카운트",
      href: "https://youngjun5.github.io/torah/",
      icon: "scroll",
      status: "live"
    },
    {
      title: "영어 공부방",
      desc: "하루 한 문장 — 선교를 위한 매일 영어 말하기 훈련",
      href: "https://youngjun5.github.io/english/",
      icon: "lang",
      status: "live"
    },
    {
      title: "화상채팅",
      desc: "CARECENTER MEET — 팀 화상회의 룸",
      href: "https://carecenter-meet.youngjun981221.workers.dev/",
      icon: "video",
      status: "live"
    }
  ];

  var wrap = document.getElementById("rooms");
  ROOMS.forEach(function (r) {
    var disabled = !r.href;
    var el = document.createElement(disabled ? "div" : "a");
    el.className = "room" + (disabled ? " disabled" : "");
    if (!disabled) { el.href = r.href; }
    el.innerHTML =
      '<div class="room-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + ICONS[r.icon] + '</svg></div>' +
      '<div class="room-body"><h2 class="room-title"></h2><p class="room-desc"></p></div>' +
      '<div class="room-foot"><span class="status ' + r.status + '"></span>' +
      (disabled ? '' : '<svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>') +
      '</div>';
    el.querySelector(".room-title").textContent = r.title;
    el.querySelector(".room-desc").textContent = r.desc;
    el.querySelector(".status").textContent = r.status === "live" ? "열려있음" : "준비 중";
    wrap.appendChild(el);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
