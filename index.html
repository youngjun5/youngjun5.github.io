<style>
:root{
  color-scheme: dark;
  --ground:#121316; --grid-line:rgba(230,231,233,0.05);
  --surface:#1b1c20; --surface-2:#202227; --surface-3:#282b31;
  --hair:rgba(231,232,234,0.10); --hair-strong:rgba(231,232,234,0.22);
  --ink:#e7e8ea; --ink-soft:#9a9ea6; --ink-faint:#878c95;
  --accent:#5ba0d8; --accent-soft:rgba(91,160,216,0.14); --accent-ink:#0d1520;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);
  font:15px/1.6 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:72px 72px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4.5vw,32px) calc(40px + var(--bot))}

/* ── 상단바 ── */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(var(--top) + 12px) clamp(16px,4.5vw,32px) 12px;
  background:linear-gradient(var(--ground) 72%,rgba(18,19,22,0));
  max-width:1080px;margin:0 auto}
.mark{width:30px;height:30px;border-radius:8px;overflow:hidden;flex:none;
  border:1px solid var(--hair);background:var(--surface)}
.mark img{width:100%;height:100%;display:block;object-fit:cover}
.wordmark{font-weight:700;font-size:16px;letter-spacing:.06em}
.wordmark .dot{color:var(--accent)}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:999px;border:1px solid var(--hair-strong);
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:none}
.ib:hover,.ib:focus-visible{color:var(--ink);border-color:var(--ink-faint);outline:none}
.owner{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}

/* ── 히어로 ── */
.hero{padding:6px 0 20px}
.hero h1{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.12;
  font-size:clamp(21px,6.4vw,42px)}
.hero em{font-style:normal;color:var(--accent)}
.hero .vsub{display:block;margin-top:9px;font-size:clamp(10.5px,2.5vw,12.5px);
  font-family:var(--mono);letter-spacing:.14em;color:var(--ink-faint);line-height:1.7}
@media(min-width:640px){ .hero{padding:12px 0 28px} }

/* ── 일정 카드 ── */
.agenda{display:block;background:var(--surface);border:1px solid var(--hair);
  border-radius:14px;padding:15px 16px;margin-bottom:20px}
.agenda:hover{border-color:var(--hair-strong)}
.ahead{display:flex;align-items:center;justify-content:space-between;
  font-size:12px;font-family:var(--mono);letter-spacing:.1em;color:var(--ink-faint);margin-bottom:10px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;
  padding:7px 0;border-top:1px solid var(--hair);font-size:13.5px}
.arow:first-child{border-top:0;padding-top:0}
.adot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);align-self:center}
.adot.soon{background:var(--accent)}
.aproj{display:none}
.atitle{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
.add.soon{color:var(--accent)}
.aempty{margin:0;font-size:13px;color:var(--ink-faint)}
@media(min-width:560px){
  .arow{grid-template-columns:auto auto 1fr auto;gap:11px}
  .aproj{display:block;color:var(--ink-faint);font-size:12.5px;white-space:nowrap}
}

/* ── 아이콘 그리드 ── */
.secthead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.secthead h2{margin:0;font-size:12px;font-family:var(--mono);letter-spacing:.13em;
  color:var(--ink-faint);font-weight:500}
.secthead .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:520px){ .grid{grid-template-columns:repeat(4,1fr);gap:11px} }
@media(min-width:820px){ .grid{grid-template-columns:repeat(5,1fr);gap:13px} }
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  padding:16px 8px 14px;border:1px solid var(--hair);border-radius:16px;
  background:var(--surface);transition:transform .16s ease,border-color .16s ease,background .16s ease}
.tile:hover{border-color:var(--accent);background:var(--surface-2)}
.tile:focus-visible{border-color:var(--accent);background:var(--surface-2);
  outline:2px solid var(--accent);outline-offset:2px}
.agenda:focus-visible,.sitem:focus-visible,.shint button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.tile:active{transform:scale(.96)}
.tile.off{opacity:.42;pointer-events:none}
.ticon{width:44px;height:44px;border-radius:13px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.tile:hover .ticon{background:var(--accent-soft);color:var(--accent)}
.tname{font-size:12.5px;font-weight:500;line-height:1.3;word-break:keep-all}
.tsum{display:flex;flex-direction:column;gap:2px;font-size:10.5px;line-height:1.35;color:var(--ink-faint);word-break:keep-all}
.tsum b{font-weight:500;color:var(--ink-soft)}
.tsum:empty{display:none}
.tdesc{display:none;font-size:11.5px;color:var(--ink-faint);line-height:1.45;word-break:keep-all}
@media(min-width:820px){
  .tile{padding:20px 12px 16px}
  .ticon{width:50px;height:50px;border-radius:15px}
  .tname{font-size:13.5px}
  .tdesc{display:block}
}

/* ── 검색 ── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sbar{display:flex;align-items:center;gap:9px;padding:calc(var(--top) + 12px) clamp(14px,4vw,24px) 12px;
  border-bottom:1px solid var(--hair)}
.sinput{flex:1;background:var(--surface);border:1px solid var(--hair-strong);border-radius:11px;
  padding:12px 14px;font-size:16px;color:var(--ink)}
.sinput:focus{outline:none;border-color:var(--accent)}
.sinput::placeholder{color:var(--ink-faint)}
.scancel{font-size:14px;color:var(--ink-soft);padding:6px 4px;flex:none}
.sbody{flex:1;overflow-y:auto;padding:8px clamp(14px,4vw,24px) calc(28px + var(--bot))}
.sgroup{margin-top:16px}
.sgroup h3{margin:0 0 7px;font-size:11px;font-family:var(--mono);letter-spacing:.12em;
  color:var(--ink-faint);font-weight:500;display:flex;justify-content:space-between}
.sitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:11px 13px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);
  margin-bottom:6px}
.sitem:hover,.sitem:focus-visible{border-color:var(--accent);outline:none}
.sitem>span:first-child{min-width:0}
.sitem .t{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.sitem .s{display:block;font-size:12px;color:var(--ink-faint);margin-top:3px;
  overflow-wrap:anywhere;line-height:1.45}
.sitem .go{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.sitem mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.smsg{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:40px 10px}
.shint{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.shint button{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--hair);
  border-radius:999px;padding:6px 12px}
.shint button:hover{border-color:var(--ink-faint);color:var(--ink)}

/* 타일 등장 — 그리드 순서대로 (Flat Design + Micro-interactions) */
@keyframes ccTileIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.tile{animation:ccTileIn .34s cubic-bezier(.34,1.28,.64,1) both}
.tile:nth-child(1){animation-delay:.02s} .tile:nth-child(2){animation-delay:.05s}
.tile:nth-child(3){animation-delay:.08s} .tile:nth-child(4){animation-delay:.11s}
.tile:nth-child(5){animation-delay:.14s} .tile:nth-child(6){animation-delay:.17s}
.tile:nth-child(7){animation-delay:.20s} .tile:nth-child(8){animation-delay:.23s}
.tile:nth-child(9){animation-delay:.26s} .tile:nth-child(10){animation-delay:.29s}
.tile:nth-child(11){animation-delay:.32s} .tile:nth-child(12){animation-delay:.35s}
.tile:nth-child(n+13){animation-delay:.38s}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
  .tile{animation:none}
}
</style>
</head>
<body>

<div class="bar">
  <span class="mark"><img src="./mark-256.png" alt=""></span>
  <span class="wordmark">CARECENTER<span class="dot">.</span></span>
  <span class="sp"></span>
  <span class="owner">youngjun</span>
  <button class="ib" id="searchBtn" aria-label="검색">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L17 17"/></svg>
  </button>
</div>

<div class="wrap">
  <section class="hero">
    <h1>TO <em>CARE</em>, <em>CHANGE</em>,<br>AND <em>CONQUER</em></h1>
    <span class="vsub">EVERY CORNER OF OUR LIVES<br>LIKE JESUS CHRIST</span>
  </section>

  <a class="agenda" id="agenda" href="https://youngjun5.github.io/calendar/" hidden>
    <div class="ahead"><span>다가오는 일정</span><span>→</span></div>

  </a>

  <div class="secthead">

  </div>
  <div class="grid" id="rooms"></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="전역 검색">
  <div class="sbar">
    <input class="sinput" id="sq" type="search" placeholder="방 · 일정 · 장비 · 토라포션 · 영어 문장" autocomplete="off" enterkeyhint="search">

  <div class="sbody" id="sbody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

function svg(k){
  return '<svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[k] || ICONS.note) + '</svg>';
}
function esc2(v){ return String(v==null?'':v).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';}); }

(function(){
  var wrap = document.getElementById('rooms');
  ROOMS.forEach(function(r){
    var live = !!r.href && r.status === 'live';
    var el = document.createElement(live ? 'a' : 'div');
    el.className = 'tile' + (live ? '' : ' off');
    if (live) el.href = r.href;
    el.innerHTML = '<span class="ticon">' + svg(r.icon) + '</span>' +
                   '<span class="tname">' + esc2(r.title) + '</span>' +
                   '<span class="tdesc">' + esc2(r.desc) + '</span>' +
                   (r.summary ? '<span class="tsum" data-sum="' + esc2(r.summary) + '"></span>' : '');
    wrap.appendChild(el);
  });
  document.getElementById('roomCount').textContent = ROOMS.length + '개';
})();

/* ═══ 전역 검색 ═══ */
(function(){
  var sheet = document.getElementById('sheet'), q = document.getElementById('sq'), body = document.getElementById('sbody');
  var INDEX = null, loading = false, scheduleRows = [];
  window.__setSchedule = function(rows){ scheduleRows = rows || []; };

  function open(){
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    q.value = ''; render('');
    setTimeout(function(){ q.focus(); }, 30);
    ensureIndex();
  }
  function close(){ sheet.hidden = true; document.body.style.overflow = ''; }
  document.getElementById('searchBtn').onclick = open;
  document.getElementById('sclose').onclick = close;
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !sheet.hidden) close();
    if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && sheet.hidden &&
        !/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'')) { e.preventDefault(); open(); }
  });

  function ensureIndex(){
    if (INDEX || loading) return;
    loading = true;
    fetch('./search-index.json').then(function(r){ return r.json(); })
      .then(function(d){ INDEX = d; loading = false; if (q.value) render(q.value); })
      .catch(function(){ INDEX = []; loading = false; });
  }

  function hl(text, needle){
    var t = esc2(text);
    if (!needle) return t;
    var i = text.toLowerCase().indexOf(needle);
    if (i < 0) return t;
    return esc2(text.slice(0,i)) + '<mark>' + esc2(text.slice(i,i+needle.length)) + '</mark>' + esc2(text.slice(i+needle.length));
  }

  function render(raw){
    var needle = raw.trim().toLowerCase();
    if (!needle){
      body.innerHTML = '<div class="smsg">방 이름, 장비, 토라 포션, 영어 문장, 일정을 한 번에 찾습니다.' +
        '<div class="shint">' + ['a7m4','토라','오메르','촬영','인사'].map(function(w){
          return '<button data-w="' + w + '">' + w + '</button>'; }).join('') + '</div></div>';
      [].forEach.call(body.querySelectorAll('.shint button'), function(b){
        b.onclick = function(){ q.value = b.dataset.w; render(b.dataset.w); q.focus(); };
      });
      return;
    }

    var groups = {};
    function push(room, title, sub, url){
      (groups[room] = groups[room] || []).push({ t:title, s:sub, u:url });
    }

    ROOMS.forEach(function(r){
      if ((r.title + ' ' + r.desc).toLowerCase().indexOf(needle) >= 0 && r.href) push('방', r.title, r.desc, r.href);
    });
    scheduleRows.forEach(function(x){
      if ((x.label + ' ' + (x.proj||'')).toLowerCase().indexOf(needle) >= 0)
        push('일정', x.label, x.proj + ' · ' + x.when, 'https://youngjun5.github.io/calendar/');
    });
    if (INDEX){
      for (var i = 0; i < INDEX.length; i++){
        var it = INDEX[i];
        if ((it.t + ' ' + it.s).toLowerCase().indexOf(needle) >= 0)
          push(it.r, it.t, it.s, './' + it.u);
      }
    }

    var keys = Object.keys(groups);
    if (!keys.length){
      body.innerHTML = '<div class="smsg">' + (INDEX ? '찾는 내용이 없어요.' : '색인을 불러오는 중...') + '</div>';
      return;
    }
    var total = 0;
    body.innerHTML = keys.map(function(k){
      var list = groups[k], shown = list.slice(0, 8);
      total += list.length;
      return '<div class="sgroup"><h3><span>' + esc2(k) + '</span><span>' + list.length + '건</span></h3>' +
        shown.map(function(o){
          return '<a class="sitem" href="' + esc2(o.u) + '"><span><span class="t">' + hl(o.t, needle) + '</span>' +
            (o.s ? '<span class="s">' + hl(o.s, needle) + '</span>' : '') + '</span><span class="go">열기 ›</span></a>';
        }).join('') +
        (list.length > shown.length ? '<div class="smsg" style="padding:6px 0;font-size:12px">외 ' + (list.length - shown.length) + '건</div>' : '') +
        '</div>';
    }).join('');
  }

  q.addEventListener('input', function(){ render(q.value); });
})();
</script>

<script>
  (function () {

      table: 'carescript', row: 'team-calendar'
    };
    function D(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function iso(d) { var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
    function days(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
    function md(s) { var p = String(s).split('-'); return p[1] + '/' + p[2]; }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }
    function keyDate(r) { return r.kind === 'milestone' ? r.start : r.end; }
    function openRow(r) { return !r.done && r.kind !== 'cancelled' && r.kind !== 'blocked'; }
    function dday(d) {
      var n = days(iso(new Date()), d);
      if (n === 0) return '오늘';
      if (n === 1) return '내일';
      if (n < 0) return (-n) + '일 지남';
      return 'D-' + n;
    }

    function renderAgenda(S) {
      var box = document.getElementById('agendaBody');
      if (!S || !S.groups) { box.innerHTML = '<p class="aempty">아직 등록된 일정이 없어요.</p>'; return; }
      var all = [];
      S.groups.forEach(function (g) { g.rows.forEach(function (r) { all.push({ g: g, r: r }); }); });
      if (window.__setSchedule) window.__setSchedule(all.map(function (x) {
        return { label: x.r.label, proj: x.g.name, when: keyDate(x.r) };
      }));
      var open = all.filter(function (x) { return openRow(x.r); });

      var now = open.filter(function (x) { return days(iso(new Date()), x.r.start) <= 0 && days(iso(new Date()), x.r.end) >= 0; });
      var fut = open.filter(function (x) { return days(iso(new Date()), keyDate(x.r)) > 0; })
                    .sort(function (a, b) { return days(keyDate(a.r), keyDate(b.r)); });
      var late = open.filter(function (x) { return days(iso(new Date()), keyDate(x.r)) < 0; })
                     .sort(function (a, b) { return days(keyDate(b.r), keyDate(a.r)); });

      var picks = now.slice(0, 2).concat(fut.slice(0, 3)).slice(0, 4);
      if (!picks.length && late.length) picks = late.slice(0, 2);

      if (!picks.length) { box.innerHTML = '<p class="aempty">지금 진행 중이거나 다가오는 일정이 없어요.</p>'; return; }

      box.innerHTML = picks.map(function (x) {
        var d = keyDate(x.r), dd = dday(d), n = days(iso(new Date()), d);
        var soon = n <= 2;
        return '<div class="arow"><span class="adot' + (soon ? ' soon' : '') + '"></span>' +
          '<span class="aproj">' + esc(x.g.name) + '</span>' +
          '<span class="atitle">' + esc(x.r.label) + '</span>' +
          '<span class="add' + (soon ? ' soon' : '') + '">' + dd + '</span></div>';
      }).join('');
    }

    if (window.supabase && window.supabase.createClient) {
      var db = window.supabase.createClient(SB.url, SB.anon);
      function pull() {
        db.from(SB.table).select('content').eq('id', SB.row).maybeSingle().then(function (res) {
          document.getElementById('agenda').hidden = false;
          if (res.error || !res.data) { document.getElementById('agendaBody').innerHTML = '<p class="aempty">불러오지 못했어요.</p>'; return; }
          renderAgenda(res.data.content);
        });
      }
      pull();
      db.channel('hub-agenda').on('postgres_changes', { event: '*', schema: 'public', table: SB.table, filter: 'id=eq.' + SB.row }, pull).subscribe();
    }
  })();
</script>
