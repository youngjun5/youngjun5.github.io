<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="description" content="CARECENTER 촬영 — 촬영 프로젝트별 작전 지시서 모음">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="촬영">
<title>촬영 · STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --grid-line: rgba(230,231,233,0.05);
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --amber: #e0ab4c;
    --green: #6fbf85;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 22px clamp(16px, 5vw, 56px) 0;
  }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--surface); border: 1px solid var(--hair-strong);
    padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
  .wordmark {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.01em; display: flex; align-items: center; gap: 6px;
  }
  .wordmark .sep { color: var(--ink-faint); font-weight: 500; }
  .wordmark .dot { color: var(--accent); }
  header .owner {
    margin-left: auto; font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  main { padding: clamp(24px, 6vw, 56px) clamp(16px, 5vw, 56px) 72px; max-width: 980px; margin: 0 auto; }

  .intro { max-width: 640px; margin-bottom: clamp(24px, 5vw, 40px); }
  .intro .eyebrow {
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .intro h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(24px, 3.6vw, 32px); line-height: 1.18; margin: 0 0 10px;
    text-wrap: balance;
  }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 56ch; }

  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

  .project {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
    overflow: hidden; transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  a.project:hover { border-color: var(--hair-strong); transform: translateY(-2px); background: var(--surface-2); }
  a.project:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .project-cover { aspect-ratio: 16/9; background: var(--surface-2); overflow: hidden; }
  .project-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .project-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .project-title {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px; margin: 0;
  }
  .project-meta { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint); }
  .project-desc { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  .project-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
  .status {
    font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .status.upcoming { color: var(--amber); background: rgba(224,171,76,0.12); }
  .status.done { color: var(--green); background: rgba(111,191,133,0.12); }

  .arrow { color: var(--ink-faint); transition: transform .15s ease, color .15s ease; }
  a.project:hover .arrow { color: var(--accent); transform: translateX(2px); }

  .note { margin-top: 28px; color: var(--ink-faint); font-size: 12.5px; }

  footer {
    padding: 20px clamp(16px, 5vw, 56px) 40px; color: var(--ink-faint); font-size: 12px;
    max-width: 980px; margin: 0 auto;
  }
</style>
</head>
<body>

<header>
  <a class="mark" href="../"><img src="../mark-256.png" alt=""></a>
  <span class="wordmark">STUDIO<span class="sep">/</span>촬영<span class="dot">.</span></span>
  <span class="owner">케어코너즈</span>
</header>

<main>
  <div class="intro">
    <p class="eyebrow">CARECENTER 촬영</p>
    <h1>촬영 프로젝트</h1>
    <p>행사·촬영 건별로 작전 지시서를 모아뒀어요. 카드를 누르면 해당 프로젝트의 타임테이블·포지션·장비·샷리스트를 볼 수 있습니다.</p>
  </div>

  <div class="projects">
    <a class="project" href="https://youngjun5.github.io/carenote/gncd-brief.html">
      <div class="project-cover">
        <img src="https://mgvqhrdhshpuamihfvnp.supabase.co/storage/v1/object/public/board-images/img/cctb408c.jpg" alt="2026 GNCDay 포스터">
      </div>
      <div class="project-body">
        <div class="project-meta">2026.09.10 · 선한목자교회</div>
        <h2 class="project-title">GNCDay 촬영 작전 지시서</h2>
        <p class="project-desc">2026 GNCDay 콘텐츠로 드리는 예배 — 타임테이블, 5단계 임무, 카메라 포지션, 장비 체크리스트, 참고 샷 리스트</p>
        <div class="project-foot">
          <span class="status upcoming">예정</span>
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>
        </div>
      </div>
    </a>
  </div>

  <p class="note">새 촬영 프로젝트가 생기면 요청해서 추가할 수 있어요.</p>
</main>

<footer>케어노트 보드에서 정리된 작전 지시서를 모아두는 곳이에요.</footer>

</body>
</html>
