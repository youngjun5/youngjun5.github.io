<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
  /* 설치된 앱(홈 화면 아이콘)으로 이 서브앱이 직접 열리면 허브 메인으로 먼저 보냄 —
     팀원이 서브앱 페이지에서 "홈 화면에 추가"를 눌러 아이콘이 서브앱을 직접
     가리키게 저장된 경우까지 코드만으로 고치기 위함. 일반 브라우저 탭/링크로
     들어온 경우(standalone이 아님)는 그대로 이 페이지를 보여줌. */
  (function(){
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone && !document.referrer) location.replace("../"); // referrer가 있으면 허브 안에서 넘어온 정상 이동
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../shell.css">
<script src="../shell.js" defer></script>
<meta name="theme-color" content="#17181b">
<meta name="description" content="CARECENTER GEAR — 케어코너즈 촬영 장비 목록, 카테고리별로 사진과 함께 바로 확인">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEAR">
<title>GEAR · CARECENTER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --grid-line: rgba(230,231,233,0.05);
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --accent-ink: #0d1520;
    --amber: #e0ab4c;
    --green: #6fbf85;
    --red: #d9736c;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  .gtabs { display:flex; gap:4px; padding:8px 16px 6px; flex:none; }
  .gtabs a { padding:6px 16px; border-radius:999px; color:var(--ink-soft); font-weight:600; font-size:14px; border:1px solid var(--hair); }
  .gtabs a.on { background:var(--ink); color:var(--ground); border-color:var(--ink); }

  /* ---- 앱 셸: 어두운 고정 상단바 + 가장자리까지 꽉 채운 스크롤 영역 ----
     (STUDIO 허브의 "카드 늘어선 웹사이트" 느낌 대신, 케어스크립트와 같은
     네이티브 앱 느낌으로 통일. 화면폭에 따라 그리드 카드 수만 자동 조절됨) */
  .topbar {
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
    padding: calc(10px + var(--safe-t)) 16px 10px;
    background: var(--surface); border-bottom: 1px solid var(--hair);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 18px;
    margin: 0; letter-spacing: -0.02em;
  }
  .topbar .sub { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-size: 20px; color: var(--ink); background: var(--surface-2);
  }
  .iconbtn:active { background: var(--hair); }

  .content {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(40px + var(--safe-b));
  }

  .intro { max-width: 640px; margin-bottom: 22px; }
  .intro .eyebrow {
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .intro h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(24px, 3.6vw, 32px); line-height: 1.18; margin: 0 0 10px;
    text-wrap: balance;
  }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 56ch; }

  .controls {
    position: sticky; top: 0; z-index: 20; padding: 14px 0 12px; margin-bottom: 18px;
    background: linear-gradient(var(--ground) 82%, transparent);
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 11px;
    padding: 10px 14px; margin-bottom: 12px;
  }
  .search svg { flex: none; color: var(--ink-faint); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--ink);
    font: 500 14px "IBM Plex Sans", sans-serif;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search .count { font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-faint); flex: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font: 600 12.5px "IBM Plex Sans", sans-serif; letter-spacing: 0.01em;
    padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover { border-color: var(--hair-strong); color: var(--ink); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--ink-faint); font: 500 11px "IBM Plex Mono", monospace; }
  .chip.active .n { color: var(--accent); opacity: .75; }

  section.cat { margin-bottom: 30px; }
  section.cat.hidden { display: none; }
  .cat-head {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--hair);
  }
  .cat-head h2 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px; margin: 0;
  }
  .cat-head .n { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 13px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: border-color .12s ease, transform .12s ease;
  }
  .card:hover { border-color: var(--hair-strong); transform: translateY(-2px); }
  .card.no-match { display: none; }

  .card-img {
    aspect-ratio: 1 / 1; background: var(--surface-2); position: relative;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img .ph { color: var(--ink-faint); }
  .card-img .ph svg { width: 30px; height: 30px; }
  .card-img .more {
    position: absolute; right: 6px; bottom: 6px; font: 600 10px "IBM Plex Mono", monospace;
    background: rgba(0,0,0,0.55); color: #fff; padding: 2px 6px; border-radius: 999px;
  }

  .card-body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .card-name { font: 600 13px "IBM Plex Sans", sans-serif; line-height: 1.3; }
  .card-meta { font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-faint); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
  .tag {
    font: 600 10px "IBM Plex Sans", sans-serif; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .tag.ok { color: var(--green); background: rgba(111,191,133,0.12); }
  .tag.bad { color: var(--red); background: rgba(217,115,108,0.12); }
  .tag.must { color: var(--accent); background: var(--accent-soft); }
  .card-note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.4; }

  .empty { text-align: center; color: var(--ink-faint); padding: 40px 0; font-size: 13px; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(8,9,11,0.88); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox-inner { max-width: 620px; width: 100%; }
  .lightbox-imgwrap {
    background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--hair-strong);
    position: relative;
  }
  .lightbox-imgwrap img { width: 100%; display: block; max-height: 60vh; object-fit: contain; background: #0b0c0e; }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5);
    border: none; color: #fff; width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-nav.prev { left: 10px; } .lightbox-nav.next { right: 10px; }
  .lightbox-meta { padding: 16px 4px 0; }
  .lightbox-meta h3 { font-family: "Bricolage Grotesque", sans-serif; font-size: 19px; margin: 0 0 8px; }
  .lightbox-rows { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .lightbox-rows .row { display: flex; gap: 8px; }
  .lightbox-rows .k { flex: none; width: 68px; color: var(--ink-faint); font: 500 11.5px "IBM Plex Mono", monospace; }
  .lightbox-close {
    position: fixed; top: 20px; right: 20px; background: var(--surface); border: 1px solid var(--hair-strong);
    color: var(--ink); width: 36px; height: 36px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-link { color: var(--accent); }

  .footnote { padding: 20px 2px 0; color: var(--ink-faint); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.001s !important; } }
  .search-row { display:flex; gap:8px; align-items:stretch; }
  .search-row .search { flex:1; }
  .addbtn { flex:none; background:var(--ink); color:var(--ground); border:0; border-radius:12px; padding:0 16px; font:600 14px "IBM Plex Sans",sans-serif; cursor:pointer; }
  .modal { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal[hidden] { display:none; }
  .mbox { background:var(--surface); border:1px solid var(--hair-strong); border-radius:16px; width:min(440px,100%); max-height:90vh; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .mbox h3 { margin:0; font:600 17px "IBM Plex Sans",sans-serif; }
  .mf { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-soft); }
  .mf input, .mf select { background:var(--surface-2); color:var(--ink); border:1px solid var(--hair); border-radius:10px; padding:9px 10px; font:15px "IBM Plex Sans",sans-serif; }
  .mf input:focus, .mf select:focus { outline:none; border-color:var(--hair-strong); }
  .mprev { aspect-ratio:4/3; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--ink-faint); font-size:12px; text-align:center; padding:8px; }
  .mprev img { width:100%; height:100%; object-fit:contain; }
  .cats2 { display:flex; flex-wrap:wrap; gap:6px; }
  .cats2 button { background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--hair); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; }
  .cats2 button.on { background:var(--ink); color:var(--ground); border-color:var(--ink); }
  .mact { display:flex; gap:8px; margin-top:4px; }
  .mact button { flex:1; border-radius:10px; padding:10px; font:600 14px "IBM Plex Sans",sans-serif; cursor:pointer; border:1px solid var(--hair); background:var(--surface-2); color:var(--ink); }
  .mact .primary { background:var(--ink); color:var(--ground); border-color:var(--ink); }
  .mact .primary:disabled { opacity:.4; cursor:default; }
  .lb-acts { display:flex; gap:8px; margin-top:12px; }
  .lb-acts button { border:1px solid var(--hair); background:var(--surface-2); color:var(--ink); border-radius:9px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .lb-acts .del { color:var(--red); }
</style>
</head>
<body>

<div class="topbar" data-cc-replace>
  <a class="iconbtn" href="../" title="전체 앱 목록으로">‹</a>
  <div><h1>GEAR</h1><div class="sub">케어코너즈 촬영 장비</div></div>
</div>

<nav class="gtabs"><a href="./" class="on">목록</a><a href="setup.html">셋업</a></nav>
<main class="content">
  <div class="intro">
    <p class="eyebrow">CARECENTER GEAR</p>
    <h1>장비 찾기</h1>
    <p>노션 Gear 페이지에 있던 촬영 장비를 카테고리별로 정리했어요. 이름이 헷갈리면 사진으로 바로 확인하세요.</p>
  </div>

  <div class="controls">
    <div class="search-row">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6.5"/><path d="M18 18l-4.5-4.5"/></svg>
      <input id="q" type="text" placeholder="장비 이름 검색 (예: 삼각대, HDMI, 렌즈)">
      <span class="count" id="resultCount"></span>
    </div>
    <button class="addbtn" id="addGear">＋ 장비 추가</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="sections"></div>
  <p class="empty" id="emptyMsg" hidden>검색 결과가 없어요.</p>
  <p class="footnote"><span id="totalN">총 196개</span> 장비 · 노션 Gear 페이지에서 옮겨왔어요 · 이미지가 없는 항목은 아이콘으로 표시됩니다.</p>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lbClose" aria-label="닫기">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5L5 15"/></svg>
  </button>
  <div class="lightbox-inner">
    <div class="lightbox-imgwrap">
      <img id="lbImg" src="" alt="">
      <button class="lightbox-nav prev" id="lbPrev" hidden aria-label="이전 사진">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l-6 6 6 6"/></svg>
      </button>
      <button class="lightbox-nav next" id="lbNext" hidden aria-label="다음 사진">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="lightbox-meta">
      <h3 id="lbName"></h3>
      <div class="lightbox-rows" id="lbRows"></div>
      <div class="lb-acts" id="lbActs" hidden><button id="lbEdit">수정</button><button id="lbDel" class="del">삭제</button></div>
    </div>
  </div>
</div>

<div class="modal" id="gModal" hidden><div class="mbox" role="dialog" aria-label="장비 추가">
  <h3 id="gmTitle">장비 추가</h3>
  <label class="mf">이름<input id="gmName" placeholder="예: SmallHD 702 Touch" autocomplete="off"></label>
  <label class="mf">사진 링크<input id="gmLink" placeholder="제품 페이지나 사진 주소를 붙여넣기" inputmode="url" autocomplete="off"></label>
  <div class="mprev" id="gmPrev">링크를 붙이면 대표 사진이 여기 보여요</div>
  <div class="mf">대표 카테고리<div class="cats2" id="gmCats"></div></div>
  <label class="mf">가방 (선택)<select id="gmBag"></select></label>
  <label class="mf">수량<input id="gmQty" type="number" min="1" value="1"></label>
  <div class="mact"><button id="gmCancel">취소</button><button id="gmSave" class="primary" disabled>추가</button></div>
</div></div>

<script>
  var CAT_LABEL = {
    "Camera":"카메라", "Lens":"렌즈", "Sound":"사운드", "Light":"조명", "Monitor":"모니터",
    "Battery":"배터리", "Grip":"그립", "Support":"스탠드/서포트", "HDMI/USB":"HDMI/USB", "Filter":"필터", "ETC":"기타"
  };
  var CAT_ORDER = ["Camera","Lens","Sound","Light","Monitor","Battery","Grip","Support","HDMI/USB","Filter","ETC"];

  var STATUS_CLASS = { "정상":"ok", "새 것":"ok", "고장":"bad", "파손":"bad", "분실":"bad", "수리필요":"bad" };

  var data = [];
  var flatCards = []; // {el, name, cat}

  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function buildTags(item){
    var tags = [];
    (item.status||"").split(",").map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){
      tags.push('<span class="tag ' + (STATUS_CLASS[s]||"") + '">' + esc(s) + '</span>');
    });
    if (item.stage) tags.push('<span class="tag">' + esc(item.stage) + '</span>');
    if (item.must) tags.push('<span class="tag must">필수</span>');
    return tags.join("");
  }

  function cardHTML(item, idx){
    var img = item.imgs && item.imgs[0]
      ? '<img src="' + esc(imgSrc(item.imgs[0])) + '" alt="' + esc(item.name) + '" loading="lazy">'
      : '<span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-6 5"/></svg></span>';
    var more = item.imgs && item.imgs.length > 1 ? '<span class="more">+' + (item.imgs.length - 1) + '</span>' : '';
    var metaBits = [];
    if (item.qty) metaBits.push('수량 ' + esc(item.qty));
    if (item.loc) metaBits.push(esc(item.loc));
    return (
      '<div class="card" data-idx="' + idx + '" data-name="' + esc(item.name.toLowerCase()) + '">' +
        '<div class="card-img">' + img + more + '</div>' +
        '<div class="card-body">' +
          '<div class="card-name">' + esc(item.name) + '</div>' +
          (metaBits.length ? '<div class="card-meta">' + esc(metaBits.join(" · ")) + '</div>' : '') +
          (buildTags(item) ? '<div class="card-tags">' + buildTags(item) + '</div>' : '') +
          (item.note ? '<div class="card-note">' + esc(item.note) + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function render(){
    var byCat = {};
    data.forEach(function(item, idx){ item._idx = idx; (byCat[item.cat] = byCat[item.cat] || []).push(item); });

    var chipsWrap = document.getElementById("chips");
    var chipsHTML = '<button class="chip active" data-cat="all">전체 <span class="n">' + data.length + '</span></button>';
    CAT_ORDER.forEach(function(cat){
      if (!byCat[cat]) return;
      chipsHTML += '<button class="chip" data-cat="' + cat + '">' + (CAT_LABEL[cat]||cat) + ' <span class="n">' + byCat[cat].length + '</span></button>';
    });
    chipsWrap.innerHTML = chipsHTML;

    var sectionsWrap = document.getElementById("sections");
    var html = "";
    CAT_ORDER.forEach(function(cat){
      if (!byCat[cat]) return;
      html += '<section class="cat" data-cat="' + cat + '">' +
        '<div class="cat-head"><h2>' + (CAT_LABEL[cat]||cat) + '</h2><span class="n">' + byCat[cat].length + '개</span></div>' +
        '<div class="grid">' + byCat[cat].map(function(it){ return cardHTML(it, it._idx); }).join("") + '</div>' +
      '</section>';
    });
    sectionsWrap.innerHTML = html;

    flatCards = Array.prototype.slice.call(document.querySelectorAll(".card"));
    flatCards.forEach(function(el){
      el.addEventListener("click", function(){ openLightbox(parseInt(el.getAttribute("data-idx"), 10)); });
    });

    chipsWrap.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        chipsWrap.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
        chip.classList.add("active");
        var cat = chip.getAttribute("data-cat");
        document.querySelectorAll("section.cat").forEach(function(sec){
          sec.classList.toggle("hidden", cat !== "all" && sec.getAttribute("data-cat") !== cat);
        });
        applySearch();
      });
    });
  }

  function applySearch(){
    var q = document.getElementById("q").value.trim().toLowerCase();
    var visibleCount = 0;
    flatCards.forEach(function(el){
      var sectionHidden = el.closest("section.cat").classList.contains("hidden");
      var match = !q || el.getAttribute("data-name").indexOf(q) !== -1;
      var show = match && !sectionHidden;
      el.classList.toggle("no-match", !show);
      if (show) visibleCount++;
    });
    document.querySelectorAll("section.cat").forEach(function(sec){
      if (sec.classList.contains("hidden")) return;
      var anyVisible = Array.prototype.some.call(sec.querySelectorAll(".card"), function(c){ return !c.classList.contains("no-match"); });
      sec.style.display = anyVisible ? "" : "none";
    });
    document.getElementById("resultCount").textContent = q ? (visibleCount + "개") : "";
    document.getElementById("emptyMsg").hidden = visibleCount !== 0;
  }

  document.getElementById("q").addEventListener("input", applySearch);

  // lightbox
  var lb = document.getElementById("lightbox");
  var lbState = { item: null, i: 0 };
  function showLbImage(){
    var item = lbState.item;
    document.getElementById("lbImg").src = imgSrc(item.imgs[lbState.i]);
    document.getElementById("lbPrev").hidden = item.imgs.length < 2;
    document.getElementById("lbNext").hidden = item.imgs.length < 2;
  }
  function openLightbox(idx){
    var item = data[idx];
    lbState = { item: item, i: 0 };
    document.getElementById("lbName").textContent = item.name;
    var rows = [];
    if (item.qty) rows.push(["수량", item.qty]);
    if (item.loc) rows.push(["보관 위치", item.loc]);
    if (item.status) rows.push(["상태", item.status]);
    if (item.stage) rows.push(["현재", item.stage]);
    if (item.note) rows.push(["특이사항", item.note]);
    document.getElementById("lbRows").innerHTML = rows.map(function(r){
      return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>';
    }).join("") + (item.ref && /^https?:/i.test(item.ref) ? '<div class="row"><span class="k">참고</span><a class="lightbox-link" href="' + esc(item.ref) + '" target="_blank" rel="noopener">제품 정보 링크</a></div>' : "");
    if (item.imgs && item.imgs.length){
      showLbImage();
      document.getElementById("lbImg").style.display = "";
    } else {
      document.getElementById("lbImg").style.display = "none";
    }
    document.getElementById("lbActs").hidden = !item._custom;
    lb.hidden = false;
  }
  document.getElementById("lbClose").addEventListener("click", function(){ lb.hidden = true; });
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.hidden = true; });
  document.getElementById("lbPrev").addEventListener("click", function(){
    lbState.i = (lbState.i - 1 + lbState.item.imgs.length) % lbState.item.imgs.length; showLbImage();
  });
  document.getElementById("lbNext").addEventListener("click", function(){
    lbState.i = (lbState.i + 1) % lbState.item.imgs.length; showLbImage();
  });
  document.addEventListener("keydown", function(e){
    if (lb.hidden) return;
    if (e.key === "Escape") lb.hidden = true;
    if (e.key === "ArrowLeft") document.getElementById("lbPrev").click();
    if (e.key === "ArrowRight") document.getElementById("lbNext").click();
  });

  /* ═══ 직접 추가한 장비 — Supabase carescript 행 'gear-custom' (셋업 탭도 같이 읽음) ═══ */
  var SB = { url:'https://mgvqhrdhshpuamihfvnp.supabase.co',
    anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ndnFocmRoc2hwdWFtaWhmdm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTE4NjQsImV4cCI6MjEwNDE4Nzg2NH0.fjDJuG-47YHU63lydUSZGAGg3FQ-DLGLp9ufnJ4SN30',
    table:'carescript', row:'gear-custom' };
  var base = [], custom = { schema:1, items:{} }, db = null;
  function imgSrc(f){ return /^(https?:|data:)/i.test(f) ? f : "images/" + f; }
  function rebuild(){
    var add = Object.keys(custom.items).map(function(k){ return custom.items[k]; })
      .filter(function(x){ return !x.del; }).sort(function(a,b){ return a.c - b.c; })
      .map(function(x){ return { id:x.id, name:x.name, cat:x.cat, qty:x.qty||"", loc:x.loc||"", status:"", stage:"", note:"", must:"", ref:x.ref||"", imgs:x.img?[x.img]:[], _custom:true }; });
    data = base.concat(add);
    document.getElementById("totalN").textContent = "총 " + data.length + "개";
    var q = document.getElementById("q").value; render(); if (q) applySearch();
  }
  function mergeCustom(R){
    if (!R || !R.items) return false; var ch = false;
    Object.keys(R.items).forEach(function(k){ var a = custom.items[k], b = R.items[k]; if (!a || b.u > a.u){ custom.items[k] = b; ch = true; } });
    return ch;
  }
  function pullCustom(){
    return db.from(SB.table).select("content").eq("id", SB.row).maybeSingle().then(function(res){
      if (res.error) { console.error(res.error); return false; }
      return mergeCustom(res.data && res.data.content);
    });
  }
  function pushCustom(){
    try { localStorage.setItem("gear:custom", JSON.stringify(custom)); } catch(e){}
    if (!db) return Promise.resolve();
    return pullCustom().then(function(){
      return db.from(SB.table).upsert({ id:SB.row, content:custom, rev:Date.now(), updated_at:new Date().toISOString() });
    }).then(function(res){ if (res && res.error) alert("저장 실패: " + res.error.message); });
  }

  /* ═══ 장비 추가/수정 창 ═══ */
  var gm = { id:null, cat:"", img:"" }, linkT = null, linkSeq = 0;
  function $g(id){ return document.getElementById(id); }
  function gmValid(){ $g("gmSave").disabled = !($g("gmName").value.trim() && gm.cat); }
  function setPrev(url, msg){
    gm.img = url || "";
    $g("gmPrev").innerHTML = url ? '<img src="' + esc(url) + '" alt="">' : esc(msg || "링크를 붙이면 대표 사진이 여기 보여요");
  }
  function tryImage(url){
    return new Promise(function(ok){ var im = new Image(); im.onload = function(){ ok(im.naturalWidth > 1); }; im.onerror = function(){ ok(false); }; im.src = url; });
  }
  /* 사진 주소면 그대로, 제품 페이지면 그 페이지의 대표 이미지(og:image)를 찾아 씀 */
  function resolveLink(url){
    var seq = ++linkSeq;
    if (!/^https?:\/\//i.test(url)) { setPrev("", url ? "http로 시작하는 링크를 붙여주세요" : ""); return; }
    $g("gmPrev").textContent = "사진 찾는 중…";
    tryImage(url).then(function(isImg){
      if (seq !== linkSeq) return;
      if (isImg) { setPrev(url); return; }
      return fetch("https://api.microlink.io/?url=" + encodeURIComponent(url)).then(function(r){ return r.json(); }).then(function(j){
        if (seq !== linkSeq) return;
        var u = j && j.data && ((j.data.image && j.data.image.url) || (j.data.logo && j.data.logo.url));
        if (u) setPrev(u); else setPrev("", "이 링크에서 대표 사진을 못 찾았어요. 사진 자체의 주소(이미지 우클릭 → 이미지 주소 복사)를 붙여주세요.");
      });
    }).catch(function(){ if (seq === linkSeq) setPrev("", "사진을 불러오지 못했어요. 사진 자체의 주소를 붙여주세요."); });
  }
  function openGm(item){
    gm = { id: item ? item.id : null, cat: item ? item.cat : "", img: item && item.imgs[0] ? item.imgs[0] : "" };
    $g("gmTitle").textContent = item ? "장비 수정" : "장비 추가";
    $g("gmSave").textContent = item ? "저장" : "추가";
    $g("gmName").value = item ? item.name : "";
    $g("gmLink").value = item ? (item.ref || item.imgs[0] || "") : "";
    $g("gmQty").value = item && item.qty ? item.qty : 1;
    setPrev(gm.img);
    $g("gmCats").innerHTML = CAT_ORDER.map(function(c){ return '<button type="button" data-c="' + c + '" class="' + (c === gm.cat ? "on" : "") + '">' + (CAT_LABEL[c] || c) + '</button>'; }).join("");
    var bags = []; data.forEach(function(x){ if (x.loc && bags.indexOf(x.loc) < 0) bags.push(x.loc); }); bags.sort();
    $g("gmBag").innerHTML = '<option value="">없음</option>' + bags.map(function(b){ return '<option' + (item && item.loc === b ? " selected" : "") + '>' + esc(b) + '</option>'; }).join("");
    gmValid(); $g("gModal").hidden = false; setTimeout(function(){ $g("gmName").focus(); }, 30);
  }
  $g("addGear").onclick = function(){ openGm(null); };
  $g("gmCancel").onclick = function(){ $g("gModal").hidden = true; };
  $g("gModal").addEventListener("click", function(e){ if (e.target === this) this.hidden = true; });
  $g("gmName").oninput = gmValid;
  $g("gmLink").oninput = function(){ var v = this.value.trim(); clearTimeout(linkT); linkT = setTimeout(function(){ resolveLink(v); }, 400); };
  $g("gmCats").onclick = function(e){ var b = e.target.closest("[data-c]"); if (!b) return; gm.cat = b.dataset.c;
    this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); }); gmValid(); };
  $g("gmSave").onclick = function(){
    var name = $g("gmName").value.trim(); if (!name || !gm.cat) return;
    var link = $g("gmLink").value.trim(), t = Date.now(), id = gm.id || ("c" + t.toString(36) + Math.random().toString(36).slice(2,6));
    var old = custom.items[id] || {};
    custom.items[id] = { id:id, c:old.c || t, u:t, name:name, cat:gm.cat, img:gm.img, ref:(link && link !== gm.img) ? link : "",
      loc:$g("gmBag").value, qty:String(Math.max(1, +$g("gmQty").value || 1)) };
    $g("gModal").hidden = true; lb.hidden = true; rebuild(); pushCustom();
  };
  $g("lbEdit").onclick = function(){ openGm(lbState.item); };
  $g("lbDel").onclick = function(){
    var b = this; if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "한 번 더 누르면 삭제"; return; }
    b.dataset.arm = ""; b.textContent = "삭제";
    var it = custom.items[lbState.item.id]; if (it) { it.del = true; it.u = Date.now(); }
    lb.hidden = true; rebuild(); pushCustom();
  };
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") $g("gModal").hidden = true; });

  try { var lc = JSON.parse(localStorage.getItem("gear:custom") || "null"); if (lc && lc.items) custom = lc; } catch(e){}
  fetch("./gear_data.json").then(function(r){ return r.json(); }).then(function(json){
    base = json;
    rebuild();
    if (window.supabase && window.supabase.createClient && !/[?&]solo/.test(location.search)) {
      db = window.supabase.createClient(SB.url, SB.anon);
      pullCustom().then(function(ch){ if (ch) { try { localStorage.setItem("gear:custom", JSON.stringify(custom)); } catch(e){} rebuild(); } });
      db.channel("gearc").on("postgres_changes", { event:"*", schema:"public", table:SB.table, filter:"id=eq." + SB.row },
        function(){ if (!$g("gModal").hidden) return; pullCustom().then(function(ch){ if (ch) rebuild(); }); }).subscribe();
    }
  });
</script>
</body>
</html>
