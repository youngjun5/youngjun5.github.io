<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
  (function(){
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone && !document.referrer) location.replace("../");
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<meta name="description" content="CARECENTER 주간 나의 회고록 — 매주 일요일, 저널을 모아 자동으로 정리되는 한 주의 생각과 방향">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주간 회고록">
<title>주간 나의 회고록 · CARECENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #121316;
    --surface: #1b1c20;
    --surface-2: #202227;
    --hair: rgba(231,232,234,0.10);
    --hair-strong: rgba(231,232,234,0.22);
    --ink: #e7e8ea;
    --ink-soft: #9a9ea6;
    --ink-faint: #6b6f78;
    --accent: #5ba0d8;
    --accent-soft: rgba(91,160,216,0.14);
    --amber: #e0ab4c;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  .topbar {
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
    padding: calc(10px + var(--safe-t)) 16px 10px;
    background: var(--surface); border-bottom: 1px solid var(--hair);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 18px;
    margin: 0; letter-spacing: -0.02em;
  }
  .topbar .sub { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-size: 20px; color: var(--ink); background: var(--surface-2);
  }
  .iconbtn:active { background: var(--hair); }

  .content {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(40px + var(--safe-b));
  }

  .intro { max-width: 640px; margin-bottom: 22px; }
  .intro .eyebrow {
    font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  .intro h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: clamp(24px, 3.6vw, 32px); line-height: 1.18; margin: 0 0 10px;
  }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 58ch; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
    cursor: pointer; transition: border-color .12s ease, background .12s ease;
  }
  .row:hover { border-color: var(--hair-strong); background: var(--surface-2); }
  .row-icon { font-size: 20px; flex: none; width: 26px; text-align: center; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font: 600 14px "IBM Plex Sans", sans-serif; margin-bottom: 3px; }
  .row-meta { font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-faint); }
  .row-arrow { color: var(--ink-faint); flex: none; }
  .row:hover .row-arrow { color: var(--accent); }

  .empty { text-align: center; color: var(--ink-faint); padding: 60px 0; font-size: 13px; }
  .footnote { padding: 20px 2px 0; color: var(--ink-faint); font-size: 12px; }

  .reader {
    position: fixed; inset: 0; background: var(--ground); z-index: 100;
    overflow-y: auto;
  }
  .reader[hidden] { display: none; }
  .reader-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: calc(14px + var(--safe-t)) clamp(16px, 5vw, 40px) 14px; background: rgba(18,19,22,0.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--hair);
  }
  .reader-back {
    display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px "IBM Plex Mono", monospace;
    color: var(--ink-soft); cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hair);
  }
  .reader-back:hover { color: var(--ink); border-color: var(--hair-strong); }
  .reader-tag {
    margin-left: auto; font: 600 10px "IBM Plex Sans", sans-serif; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .reader-art {
    max-width: 720px; margin: 0 auto; padding: 30px clamp(16px, 5vw, 40px) calc(100px + var(--safe-b));
  }
  .reader-art .icon { font-size: 34px; margin-bottom: 10px; }
  .reader-art h2 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: clamp(22px, 4vw, 30px);
    line-height: 1.25; margin: 0 0 6px;
  }
  .reader-art .date { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-faint); margin-bottom: 24px; }

  .reader-body { font: 400 15.5px/1.85 "IBM Plex Sans", sans-serif; color: var(--ink); }
  .reader-body h1, .reader-body h2, .reader-body h3 {
    font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 20px; color: var(--ink);
    margin: 30px 0 12px;
  }
  .reader-body h4 {
    font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 16.5px; color: var(--ink);
    margin: 22px 0 8px;
  }
  .reader-body p { margin: 0 0 14px; }
  .reader-body strong { color: var(--ink); font-weight: 700; }
  .reader-body em { color: var(--ink-soft); }
  .reader-body hr { border: none; border-top: 1px solid var(--hair); margin: 28px 0; }
  .reader-body ul, .reader-body ol { margin: 0 0 14px; padding-left: 22px; }
  .reader-body li { margin-bottom: 6px; }
  .reader-body blockquote {
    margin: 0 0 14px; padding: 4px 0 4px 16px; border-left: 2px solid var(--accent);
    color: var(--ink-soft); font-style: italic;
  }
  .reader-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .reader-body code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font: 500 13px "IBM Plex Mono", monospace; }

  .loading { text-align: center; color: var(--ink-faint); padding: 60px 0; font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="iconbtn" href="../" title="전체 앱 목록으로">‹</a>
  <div><h1>주간 나의 회고록</h1><div class="sub">매주 일요일 자동 정리</div></div>
</div>

<main class="content">
  <div class="intro">
    <p class="eyebrow">CARECENTER 주간 회고록</p>
    <h1>주간 나의 회고록</h1>
    <p>매주 일요일 저녁, 그 주에 쓴 저널을 모아 어떤 생각을 했는지 · 반복되는 패턴은 뭔지 · 하나로 모이는 방향이 있다면 무엇인지 자동으로 정리돼요.</p>
  </div>

  <div class="list" id="list"></div>
  <p class="loading" id="loadingMsg">불러오는 중...</p>
  <p class="empty" id="emptyMsg" hidden>아직 생성된 주간 회고록이 없어요. 다음 일요일 저녁에 첫 회고록이 자동으로 올라와요.</p>
  <p class="footnote">Obsidian 저널을 바탕으로 자동 생성돼요 · 매주 일요일 저녁 8시 · 로컬 볼트 내용은 수정되지 않아요.</p>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <span class="reader-back" id="readerBack">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>
      목록으로
    </span>
    <span class="reader-tag" id="readerTag"></span>
  </div>
  <div class="reader-art">
    <div class="icon">📔</div>
    <h2 id="readerTitle"></h2>
    <div class="date" id="readerDate"></div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
<script>
  var SB = {
    url: 'https://mgvqhrdhshpuamihfvnp.supabase.co',
    anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ndnFocmRoc2hwdWFtaWhmdm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTE4NjQsImV4cCI6MjEwNDE4Nzg2NH0.fjDJuG-47YHU63lydUSZGAGg3FQ-DLGLp9ufnJ4SN30',
    table: 'carescript', row: 'weekly-retro'
  };

  var listEl = document.getElementById("list");
  var loadingMsg = document.getElementById("loadingMsg");
  var emptyMsg = document.getElementById("emptyMsg");
  var reader = document.getElementById("reader");
  var reviews = [];

  function esc(v) { return String(v == null ? "" : v).replace(/[&<>]/g, function (c) { return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"; }); }

  function stripWikilinks(md) {
    // [[제목]] / [[제목|표시]] -> 그냥 텍스트로 (사이트에서 볼트 노트로 갈 수 없으니 링크화하지 않음)
    return String(md || "").replace(/\[\[([^\]|]+)(\|([^\]]+))?\]\]/g, function (_, t, __, alias) {
      return esc(alias || t);
    });
  }

  function render() {
    if (!reviews.length) {
      loadingMsg.hidden = true;
      emptyMsg.hidden = false;
      return;
    }
    loadingMsg.hidden = true;
    emptyMsg.hidden = true;
    listEl.innerHTML = reviews.map(function (r, i) {
      return '<div class="row" data-i="' + i + '">' +
        '<div class="row-icon">📔</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + esc(r.title || r.date) + '</div>' +
          '<div class="row-meta">' + esc(r.period || r.date) + '</div>' +
        '</div>' +
        '<div class="row-arrow"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></div>' +
      '</div>';
    }).join("");
    Array.prototype.forEach.call(listEl.querySelectorAll(".row"), function (row) {
      row.addEventListener("click", function () { openReader(reviews[+row.dataset.i]); });
    });
  }

  function openReader(r) {
    document.getElementById("readerTitle").textContent = r.title || r.date;
    document.getElementById("readerDate").textContent = r.period || r.date;
    document.getElementById("readerTag").textContent = "주간 회고록";
    var html = (window.marked ? window.marked.parse(stripWikilinks(r.body || "")) : esc(r.body || ""));
    document.getElementById("readerBody").innerHTML = html;
    reader.hidden = false;
    reader.scrollTop = 0;
    history.pushState({ retroReader: true }, "");
  }
  function closeReader() {
    reader.hidden = true;
  }
  document.getElementById("readerBack").addEventListener("click", function () { history.back(); });
  window.addEventListener("popstate", closeReader);

  if (window.supabase && window.supabase.createClient) {
    var db = window.supabase.createClient(SB.url, SB.anon);
    function pull() {
      db.from(SB.table).select("content").eq("id", SB.row).maybeSingle().then(function (res) {
        if (res.error || !res.data || !res.data.content) { reviews = []; render(); return; }
        reviews = (res.data.content.reviews || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        render();
      });
    }
    pull();
    db.channel("retro-live").on("postgres_changes", { event: "*", schema: "public", table: SB.table, filter: "id=eq." + SB.row }, pull).subscribe();
  } else {
    loadingMsg.textContent = "불러오지 못했어요.";
  }
</script>
</body>
</html>
